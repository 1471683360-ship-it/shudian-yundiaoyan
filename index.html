":""},{"image":"img-87504f8cecc8","alt":"IDEA 官网视觉截图","caption":"IDEA · 官网首屏 / 2026-09-10 · 查看网站","url":"https://www.ideanow.online/"},{"image":"img-b61f43814298","alt":"IDEA 账号证据 ME1788934060109.png","caption":"IDEA · 账号截图 02","url":""},{"image":"img-09327b575985","alt":"IDEA 账号证据 ME1788934063324.png","caption":"IDEA · 账号截图 03","url":""}],"operations":{"账号矩阵":"IG @idea.ltd：视觉选品与品牌商品；官网：Superbooks 编辑文章、出版档案与电商；邮件：新书与项目触达，周期未确认。","内容分布":"样本重心是摄影、时尚、音乐与亚文化书刊／图像；辅以帽子、包、服饰及出版项目。书目与商品共享审美语言。 选题样本：Superbooks 旧书细读；《The Fall Lyrics》与音乐文化；PROTOTYPE 出版项目。","活动节奏":"以出版、新品和合作发布节点驱动；现有资料不能给出固定周更或月更次数。","渠道联动":"可见机制：IG 与官网内容关联，出版与合作商品可购买；跨城发布依项目发生。分析路径：图像吸引→编辑解释→版本／库存→购买或发布活动。"},"visual":{"线下空间":"人工表描述为私人档案室／买手店式陈列，封面朝外、留白突出书本；未提供完整空间照片。","官网界面":"白底、黑色粗体标志与横条，BOOKS／LOOKS并列；书、帽子和服饰进入同一商品网格，像视觉文化买手目录。","社媒表达":"书封、内页、人物和服饰交错，依靠图像选取形成气质；精选封面按商品分类，标题连成一句品牌用语。","整体调性":"识别来自持续的审美选择与简短、直接的品牌表达，而非统一海报底色。"},"tone":"潮流档案 · 强图像 · 直接表达","visualBasis":"依据：人工表J／K列、既有账号截图；官网观察于2026-09-10。风格为样本归纳，非效果评价。","insight":"以IG呈现摄影、时尚、音乐与亚文化选品，并将书刊和品牌商品放在同一审美体系中；官网Superbooks、出版档案与电商承接深读和购买，邮件维系新品关注。内容随出版／合作节点推进，固定频次未核。可借鉴“书页细节—文化背景—买手判断—版本入口”。","topics":["这张书页，为什么让人想到今天的 AI 图像？","从一顶帽子到一本书：文化符号怎样成为日常物件？"],"idea":"把京东买手的判断显性化，用艺术科技和视觉文化选书建立专业辨识度。自有出版放在货盘与出版合作明确后推进。","conditions":"买手提供实物书和版本信息；后期需出版伙伴与商品开发资源。","limits":"缺完整配文、统一时间窗及转化数据；不沿用旧稿的荷兰同名主体邮件信息。","notes":{"定位客群":{"text":"Soho目的地型。101 Wardour Street，本身就在时尚、广告、媒体、摄影高度集中的区域。它不是靠“路人进来买本书”，而是利用 Soho 的文化符号价值强化品牌身份。\t时装设计师、造型师、摄影师、创意总监、艺术指导、收藏者、国际文化游客","cell":"F3"},"空间体验":{"text":"/不是书店，是 Angela Hill 的 \"客厅\"—— 时尚圈天天来蹭沙发听黑胶，设置一个\"主理人客厅\"角落，放黑胶/收藏级书籍，让空间有\"人味\"而非纯卖场。稀有书/绝版书做镇店之宝，拍照传播性极强。","cell":"G3"},"用户体验":{"text":"1、到店入口高度“隐秘”：门牌低调，需要按门铃再上楼，公开报道仍建议预约；形成发现秘密据点的仪式感，但首次到访门槛高、容易找错。\n2、店内更像小型时装档案馆/私人资料室，Vitsœ 书架、音乐与稀有 lookbook、旧杂志营造强氛围；中国访客特别认可可近距离翻看网络上难见清晰版本的实体资料。\n3、稀缺选品和限量发售带来强烈寻宝与收藏体验，整体更偏有明确兴趣的目的性朝圣，而非大众化高效率购书。","cell":"H3"},"选品展陈":{"text":"选书极强个人审美，集中摄影、时尚、艺术、亚文化、旧杂志及绝版书，常见稀有视觉资料。陈列不像传统书店，更像时装买手店/画廊：大量封面朝外、留白明显，书本本身被当作视觉物件。","cell":"I3"},"活动社群":{"text":"以新品首发、限量签名书、品牌合作、drop 式上新为主","cell":"K3"},"会员经营":{"text":"无付费会员；邮件订阅获取新书、限量书，老客留新","cell":"L3"},"复合业态":{"text":"无自营咖啡店","cell":"M3"},"异业合作":{"text":"和摄影师、艺术家联名限量出版物；LABF 伦敦艺术书展参展；画廊 / 潮牌快闪 Pop‑up；签名书首发活动","cell":"N3"},"商业模式":{"text":"1、核心收入来自稀有艺术书、限量出版物和签名版，依靠稀缺性与收藏属性获取高客单和溢价。\n2、与艺术家、摄影师及时尚品牌合作独家出版，并以drop式限量发售制造话题和快速售罄。\n3、将自有IP延伸至服饰、海报等商品，通过DSM等全球买手店及线上渠道分销，放大品牌收入。\n4、不依赖咖啡和会员折扣，主要靠邮件订阅、老客留新和新品首发维持高黏性客群。","cell":"O3"},"筹备启发":{"text":"1、JDB能否做独立出版？\n2、获取全球顶级或当下最有热度的艺术家资源，记录当下艺术圈正在发生的人和事，独立出版，限量发售\n3、设计生产属于JDB自有IP的产品，合作全球买手店进行销售\n4、黑胶区","cell":"P3"}},"position":"以艺术、摄影、时尚与青年文化为核心，通过限量出版与独家发行，把艺术家和文化人物转化为具有收藏价值的潮流出版物品牌。","sources":[{"title":"官方首页","url":"https://www.ideanow.online/"},{"title":"Superbooks 档案","url":"https://www.ideanow.online/blogs/superbooks"},{"title":"单篇拆解样本","url":"https://www.ideanow.online/blogs/superbooks/hard-corps"},{"title":"出版目录","url":"https://www.ideanow.online/collections/publishing"},{"title":"邮件页","url":"https://www.ideanow.online/pages/newsletter"},{"title":"2017年报道","url":"https://somethingcurated.com/2017/04/24/idea-books-david-owen-angela-hill/"}],"row":3,"summaries":{"定位客群":"以视觉文化圈层为中心，目的性找书比大众漫游更能解释其定位。","空间体验":"空间的参考点是收藏与个人品味的可见性，适合研究小尺度深度阅读。","选品展陈":"跨摄影、音乐与时尚建立审美关联；重点是版本与图像判断，而非覆盖所有品类。","内容传播":"把出版物与品牌商品放在同一视觉语境中，形成从图像吸引到编辑解释的路径。","活动社群":"围绕出版与合作节点发生，属于项目驱动，而非已有证据支持的固定活动日历。","会员经营":"重点是新品触达与老客关系，不能将这种关系直接等同于付费会员体系。","复合业态":"文化商品是延伸方向，咖啡并非理解这一案例的核心。","商业模式":"值得研究的是专业零售、独家出版与文化商品之间的组合，而非单靠图书折扣。"},"topicDetails":["选取一本摄影或设计书中的具体书页，拆解构图、重复、拼贴与观看方式，再与 AI 图像提出的问题对照。京东可用“看一页—懂一种视觉方法”的图文形式连接艺术与科技，避免将形式相似直接说成创作来源。","从帽子、包或海报上的一个符号出发，追溯它与音乐、摄影或出版物的关系。京东可以做“日常物件的文化注脚”，每期连接一件物件、一本书和一个可继续阅读的问题。"],"concepts":[{"type":"空间构想","name":"一张买手的阅读桌","desc":"在艺术与视觉文化书区设置一张可翻阅的主题桌，少量书目配选书理由、版本卡与相关物件。让京东的专业判断可见，而不是用大量商品堆出“策展感”。"},{"type":"选品思路","name":"图像与物件的双向书单","desc":"围绕摄影、音乐或设计符号，将书与有明确文化联系的物件成组讨论。京东先建立选品关联标准，再决定是否引入对应商品。"},{"type":"活动构想","name":"买手带你读一页","desc":"每次围绕一页解释构图、印刷或时代背景，连到两本延伸书。可作为京东专业选书内容的活动形式储备。"}]},{"id":"tenderbooks","legacyId": 窗、留白与宽松陈列很像当代画廊，书被当作作品观看；小体量但 杂志/小出版物区域可慢逛很久，适合触摸纸张、装帧和印刷细节。\n2、独立出版、学生作品和实验杂志密度高，艺术设计人容易获得灵感；一般读者按书名快速检索的效率相对低。\n3、服务口碑有分化：聚合评价多赞店员知识丰富，但小红书有未清晰标价、结账报价争议及沟通冷淡的个案；建议强化明码标价与价格解释。","cell":"H4"},"选品展陈":{"text":"以艺术家书、摄影、设计、时尚、zine、小型独立出版为核心，新书与稀有旧书并置。陈列偏“独立出版展览”：桌面平铺、封面展示很多，密度不高，常结合橱窗装置和艺术家项目。","cell":"I4"},"活动社群":{"text":"活动频率高，官网有独立 Events Diary，覆盖 launch、talk、workshop、跨界活动","cell":"K4"},"会员经营":{"text":"无付费会员；Newsletter 推送展览、新书、表演活动，订阅用户优先获知活动","cell":"L4"},"复合业态":{"text":"无自营咖啡店","cell":"M4"},"异业合作":{"text":"自有出版品牌；店内小型艺术展览、读书会、现场表演；艺术家委托创作；新书发布","cell":"N4"},"商业模式":{"text":"1、以独立出版物、艺术家书和实验性小出版物零售为基本盘，同时承接艺术家出版和寄售。\n2、通过新书发布、展览、主题分享、创作工坊和现场表演持续引流，门店兼具销售与文化空间功能。\n3、自有出版、委托创作和跨界项目带来第二收入，也强化与艺术家及小型出版社的长期合作。\n4、无付费会员，主要以Newsletter和高频活动沉淀社群，依靠专业选品和文化认同促进复购。","cell":"O4"},"筹备启发":{"text":"1、选书关注小众出版社\n2、每个板块不同主题，比如有的是no-wifi沉浸式阅读区（互动）\n3、藏书家寄卖--系统融合、拍卖","cell":"P4"}},"position":"以独立出版为核心的艺术书店与文化活动空间。","sources":[{"title":"About","url":"https://tenderbooks.co.uk/pages/about"},{"title":"近期栏目预告","url":"https://tenderbooks.co.uk/blogs/events-window/tenderchats-ruth-sleightholme-dal-chodha-13-september-3pm"},{"title":"历史线上形式","url":"https://tenderbooks.co.uk/blogs/events-window/tenderchats-loose-joints-dal-chodha-20-july-1pm"},{"title":"HATO 对谈","url":"https://tenderbooks.co.uk/blogs/events-window/tenderchats-kenjiro-kirton-dal-chodha-27-may-1pm"},{"title":"Brea Souders 对谈","url":"https://tenderbooks.co.uk/blogs/events-window/tenderchats-brea-souders-dal-chodha-5-april-1pm"},{"title":"活动档案","url":"https://tenderbooks.co.uk/blogs/events-window"},{"title":"Quiet Volumes","url":"https://tenderbooks.co.uk/collections/quiet-volumes"}],"row":4,"summaries":{"定位客群":"独立出版与艺术家书吸引专业兴趣读者，小店也能围绕共同兴趣建立联系。","空间体验":"橱窗与书店场景可成为内容界面，启发是让展示与对谈共享一个主题。","选品展陈":"艺术家书与实验出版是底座，新书和稀有版本共同提供发现感。","内容传播":"对谈栏目提供连续的内容线索，让嘉宾、创作过程与出版物彼此连接。","活动社群":"具名栏目与单次合作并存；前者积累识别，后者带来不同的现场体验。","会员经营":"邮件与活动消息维持关注，优先研究参与理由，而非先设计付费等级。","复合业态":"购书赠饮样本体现短期合作，不能把它理解为常设餐饮经营。","商业模式":"零售与出版项目相互支持，活动的价值在于连接创作者和读者。"},"topicDetails":["以食谱的版式、摄影和叙事为切口，解释饮食出版如何跨入设计。京东可将食物、视觉文化与生活方式书并置，形成翻页短视频与三本延伸书目。","围绕一本书准备三类问题：最初的想法、一次修改、一个被保留的细节。京东可把访谈拆成草图对照、作者口述与翻书片段，让创作过程成为内容。"],"concepts":[{"type":"空间构想","name":"可以换主题的橱窗","desc":"橱窗围绕一本核心书展示草图、材料与一句问题，内部阅读桌延续同题。京东可用低复杂度的展示结构容纳不同创作者。"},{"type":"选品思路","name":"一本书的创作关系网","desc":"将作者作品、出版社相关书与参考读物配成小组，说明它们怎样影响彼此。京东可据此形成围绕创作过程的选书单元。"},{"type":"活动构想","name":"从第一张草图开始","desc":"让创作者带一份初稿和一本成书对谈，现场以过程材料组织提问。适合京东艺术设计读者，不以嘉宾知名度作为唯一吸引力。"}]},{"id":"claire-de-rouen","legacyId":"store2","name":"Claire de Rouen","country":"英国","city":"伦敦","type":"独立书店","tags":["文化社交","买手策展"],"subtitle":"把摄影与时尚阅读延伸为文化服务","cover":"img-5206c117e1ba","images":[{"image":"img-5206c117e1ba","alt":"Claire de Rouen 账号证据 ME1788933986975.png","caption":"Claire de Rouen · 账号截图 01","url":""},{"image":"img-96c7f159dc2e","alt":"Claire 官网视觉截图","caption":"Claire · 官网首屏 / 2026-09-10 · 查看网站","url":"https://www.clairederouenbooks.com/"},{"image":"img-1b7d16b50faa","alt":"Claire de Rouen 账号证据 ME1788933991780.png","caption":"Claire de Rouen · 账号截图 02","url":""}],"operations":{"账号矩阵":"IG @clairederouenbooks：书页、人物、空间；主页有 Threads／Linktree 入口，未获得其内容样本；官网：Shop、What’s on、Archive、Services；邮件：新闻、活动、新书。","内容分布":"摄影与时尚书、内页和印刷细节为主体；艺术家、夜间现场、橱窗和合作空间补充文化社交语境。 选题样本：To Entertain：书、食物与橱窗；New Work Reading Series；艺术家私人书库。","活动节奏":"发布、展览、放映、阅读系列交织，按项目排期；没有统一周／月频次证据。","渠道联动":"官网直接连接活动、书库定制和私人活动服务；2024年 Alaïa 合作空间有官方说明。分析：线上展现品味→现场建立关系→选书／书库服务。"},"visual":{"线下空间":"人工表描述为档案与私人书库式空间；截图中霓虹招牌、砖墙书籍及手写纸品，增加个性与现场感。","官网界面":"全幅摄影占据首屏，极简白字导航覆盖其上，右下角手写签名字标；首屏以人物影像建立情绪而非商品列表。","社媒表达":"大幅摄影／书页、时尚出版物与人物现场交错，纸张细节和生活片段形成带个人品味的视觉叙事。","整体调性":"以摄影和人的视角连接线上线下，书店更像一个有主人、有关系网络的文化空间。"},"tone":"摄影叙事 · 私人收藏 · 时尚语境","visualBasis":"依据：人工表J／K列、既有账号截图；官网观察于2026-09-10。风格为样本归纳，非效果评价。","insight":"IG以摄影／时尚书页为重心，搭配艺术家、橱窗与现场；官网连接活动档案、商品及定制书库等服务，邮件发布新闻与新书。活动按发布、展览、放映与阅读项目推进，固定频次未核。可借鉴“审美内容—创作者关系—专题选书服务”。","topics":["设计师家里，哪5本书被翻得最多？","从一件衣服到一张照片：同一个主题的两种语言"],"idea":"结合高端艺术文化定位，先做《创作者的私人书架》，再评估面向设计机构、酒店或品牌的专题选书服务。","conditions":"嘉宾合作、买手研究；服务产品需确定范围、交付物与报价机制。","limits":"不同空间账号分工和服务收入未核实；不能把表格中的高毛利判断当财务事实。","notes":{"定位客群":{"text":"创意社区＋高端品牌双节点。2026年主店迁到 Kingsland Road，空间扩大以承接展览、讲座、放映和社群活动；同时在 Alaïa New Bond Street 店内保留第二空间。实际上形成“东伦敦创意社区总部＋Mayfair奢侈品牌窗口”。 \t时尚、摄影、艺术行业人士，品牌团队、设计师、编辑、收藏家、机构买家\t圈层忠诚度很强。比起随机客流，更依赖行业口碑和国际客户。","cell":"F5"},"空间体验":{"text":"/主动找高端品牌做\"店中店\"合作——品牌出内部场地空间设计和装修，我们出选书和运营。书店+咖啡+品牌展示三合一，用文化调性给品牌增值。","cell":"G5"},"用户体验":{"text":"1、Kingsland Road 新空间以多房间、隐藏楼梯和档案陈列形成迷宫式体验，搭配休闲座椅，像进入创意圈的私人档案室。\n2、签名/绝版摄影与时尚书、国际杂志和限量版让浏览像寻宝，创意从业者与学生容易获得灵感；非目标客群可能感到信息密度与专业门槛较高。\n3、谈话、展览和艺术家项目延长停留时间，店员的策展知识与个性化推荐是核心服务触点。","cell":"H5"},"选品展陈":{"text":"摄影与时尚是核心，同时覆盖艺术、设计、稀有杂志、绝版及签名书，日本摄影尤其突出。选书非常“fashion insider”。陈列强调封面和视觉关系，像私人资料库与时尚研究室，而不是按畅销榜逻辑摆书。","cell":"I5"},"活动社群":{"text":"活动页清晰维护，重点做摄影书、杂志、艺术家版本发布与签售","cell":"K5"},"会员经营":{"text":"无付费会员；有B2B客户定制服务","cell":"L5"},"复合业态":{"text":"无自营咖啡店","cell":"M5"},"异业合作":{"text":"和摄影、时尚、电影创作者做签售；参与伦敦艺术书展；少量画廊联动","cell":"N5"},"商业模式":{"text":"1、稀有摄影书、时尚旧刊、签名版和艺术家限量版本构成高客单零售，收藏属性是主要溢价来源。\n2、与艺术家深度绑定，通过新书首发、签售和限定版本形成独家供给，降低与综合书店的同质化竞争。\n3、面向品牌、酒店、公共机构和藏家提供私人书库、收藏体系、艺术咨询及私人出版等高毛利B端服务。\n4、通过品牌店中店、快闪及艺术书展拓展渠道，形成专业零售、顾问服务和时尚合作并行的收入结构。","cell":"O5"},"筹备启发":{"text":"1、图书分类除了按艺术门类，也按文化议题（Feminist/Queer/Erotica)、收藏价值（signed/limited/vintage) \n2、和艺术家强绑定：新书发布、合作出艺术家限定 \n3、B端业务：为艺术家/品牌/公共机构/酒店/藏家提供定制服务，包括私人图书馆/收藏体系/艺术品咨询/私人活动承办/私人出书 \n4、时尚合作：入驻品牌方店铺，或者让品牌来入驻快闪","cell":"P5"}},"position":"以摄影与时尚为核心、以稀有艺术出版物和艺术家合作为壁垒的策展型艺术书店。","sources":[{"title":"Our story","url":"https://www.clairederouenbooks.com/pages/our-story"},{"title":"活动档案","url":"https://www.clairederouenbooks.com/pages/whats-on"},{"title":"Our services","url":"https://www.clairederouenbooks.com/pages/our-services"},{"title":"官网与邮件说明","url":"https://www.clairederouenbooks.com/"},{"title":"账号历史来源","url":"https://1granary.com/industry/claire-de-rouen-lucy-moore/"}],"row":5,"summaries":{"定位客群":"创意社区与品牌合作空间连接不同读者，具有文化专业服务的取向。","空间体验":"可借鉴的是书、人物与合作空间之间的关系；店中店构想需要品牌合作条件。","选品展陈":"摄影与时尚书形成清晰边界，稀有版本与私人书库服务延伸选书深度。","内容传播":"书页细节、人物与现场共同表达品味，官网进一步解释服务。","活动社群":"发布、阅读与放映等项目交织，适合研究多种形式如何保持同一文化语气。","会员经营":"定制服务与持续客户关系比普通会员折扣更值得深入研究。","复合业态":"品牌合作为书店提供延伸场景，不必以自营咖啡作为默认配套。","商业模式":"选书能力可以进入零售与书库服务两个入口；服务收费与利润需另看资料。"},"topicDetails":["邀请设计师逐本说明使用频率最高的书，以及它怎样影响一次工作判断。京东可将人物故事与具体书页配对，形成面向设计读者的私人书架系列。","选定“身体、褶皱或记忆”等主题，对照服装细节与摄影作品。京东通过两种媒介的共同问题串起选书，形成视觉对照图文，而非仅做品牌人物介绍。"],"concepts":[{"type":"空间构想","name":"创作者的私人书架","desc":"以轮换书架呈现一位创作者的五本书，每本配一段具体使用故事。京东可将阅读、人物与作品放在同一视线里。"},{"type":"选品思路","name":"给一个空间选十本书","desc":"以工作室、酒店会客区等具体场景讨论选书标准，提出书目与理由。京东可将它积累为未来专题书库服务的内容基础。"},{"type":"活动构想","name":"两种媒介，一个问题","desc":"邀请不同领域创作者围绕同一主题各带一本书，以书页而非个人履历展开交流。让京东跨艺术与设计的定位落到可见材料。"}]},{"id":"artwords","legacyId":"store3","name":"Artwords","country":"英国","city":"伦敦","type":"独立书店","tags":["买手策展"],"subtitle":"从杂志与新书发现当代视觉文化","cover":"img-55965df0c5f2","images":[{"image":"img-55965df0c5f2","alt":"Artwords 调研配图","caption":"Artwords · 原表配图 / 第6行","url":""},{"image":"img-84808977a16d","alt":"Artwords 官网视觉截图","caption":"Artwords · 官网首屏 / 2026-09-10 · 查看网站","url":"https://www.artwords.co.uk/"},{"image":"img-02290904eab1","alt":"Artwords 账号证据 ME1788933997767.png","caption":"Artwords · 账号截图 01","url":""},{"image":"img-9cfbce62771c","alt":"Artwords 调研配图","caption":"Artwords · 原表配图 / 第6行","url":""},{"image":"img-efa488e12edb","alt":"Artwords 调研配图","caption":"Artwords · 原表配图 / 第6行","url":""},{"image":"img-091c1faa0713","alt":"Artwords 账号证据 ME1788934001795.png","caption":"Artwords · 账号截图 02","url":""}],"operations":{"账号矩阵":"IG @artwordsbookshop：杂志、新书和活动；出版社／Eventbrite：谈话报名；既有研究官网为改版页，不能据此判断无活动。邮件与折扣当前情况待核。","内容分布":"当代视觉文化图书与杂志为样本重点；发布会、店内人物、杂志墙、门店日常和招聘作为补充。 选题样本：Astrology in Art；Serviette “Food is Vice”；Mulieris “Homeward”。","活动节奏":"按出版物到货与发布节点组织；表格称新品每周更新，是补充观察，非账号发帖频次。6月与9月截图不足以推算月度活动数。","渠道联动":"直接证据：《Astrology in Art》海报给出免费谈话／问答及 Eventbrite；Serviette、Mulieris 发布海报把内容导向门店。"},"visual":{"线下空间":"人工表强调克制空间与封面展示；原表配图以中性地面上的杂志组合为主，色彩和构图由出版物承担。","官网界面":"本次主页仍是大面积白底配中央蓝色字母图形的简洁页面；仅能评价此页，不能外推完整电商视觉。","社媒表达":"蓝色门面、杂志墙、手持书和活动海报共存；不同出版物保留自身色彩，账号识别不依赖严格同色。","整体调性":"以书刊的视觉关系做编辑，门店颜色作为辅助识别；保持专业选品与街区生活的亲近感。"},"tone":"视觉选品 · 色彩并置 · 街区日常","visualBasis":"依据：人工表J／K列、既有账号截图；官网观察于2026-09-10。风格为样本归纳，非效果评价。","insight":"IG围绕视觉文化图书、杂志、发布会及门店日常，出版社／Eventbrite补充活动报名入口。现有样本显示杂志与图书是内容底座，不能据跨月截图统计频次。可借鉴店员编辑、主题并置和出版社合作，把新品变成可持续选题。","topics":["同一个“家”，三本杂志给出三种答案","一本杂志，怎样把食物拍成一种文化？"],"idea":"将16书区里的书与书做主题并置；用《本周翻刊》连接艺术、设计、食物与城市生活，再与出版社联办活动。","conditions":"稳定杂志供给、店员编辑、出版社联络；主题标签与线下书桌同步。","limits":"表格的邮件、NUS折扣、供货业务缺当前直接证据；暂不写入确定矩阵。","notes":{"定位客群":{"text":"创意生活街区型。Broadway Market 本身就是餐饮、咖啡、独立零售、艺术手工和周末市场组成的生活方式街区。 \tHackney当地创意从业者、设计师、摄影师、建筑师、学生、年轻家庭、周末游客\t社区复购＋周末流量","cell":"F6"},"空间体验":{"text":"/每周场地空间更新主题陈列（按颜色/话题/事件），让老顾客每次来都有新鲜感。设立自有出版品牌，每年出几本限量书做差异化。跟潮流品牌/设计师做联名选品。","cell":"G6"},"用户体验":{"text":"1、白净、克制、无压迫感的空间让彩色封面成为视觉中心；按视觉文化主题浏览，可快速获取时尚、建筑、平面、摄影等跨领域灵感。\n2、新品每周更新，杂志和小众出版物丰富，像一座可购买的趋势资料库；与 Broadway Market 周边集市、咖啡馆组合，目的地体验强。\n3、店面不大，周末尤其周六可能拥挤；更适合自由慢逛，店员熟悉库存但通常不过度跟随，需要帮助时主动询问更有效。","cell":"H6"},"选品展陈":{"text":"选书覆盖当代艺术、平面设计、建筑、摄影、时尚及大量国际杂志，兼顾专业与可读性。陈列是典型设计书店：高书架负责分类，中央大桌突出新书和视觉强的封面，杂志区尤其值得观察。","cell":"I6"},"活动社群":{"text":"官网更偏电商与分类销售，活动信息不突出，可能依赖门店/社媒/合作方发布","cell":"K6"},"会员经营":{"text":"无独立付费会员；newsletter 推送展览画册到货；面向艺术机构 / 高校做 B 端批发，学生 NUS 卡 5% 常期折扣","cell":"L6"},"复合业态":{"text":"无自营咖啡","cell":"M6"},"异业合作":{"text":"画册首发，和英国各地美术馆、画廊联动销售展览出版物；策展人、艺术家讲座；面向艺术院校做 B 端供货","cell":"N6"},"商业模式":{"text":"1、以当代艺术书、展览画册和高频更新的独立杂志为核心收入，兼顾阅读价值与视觉收藏价值。\n2、与美术馆、画廊及出版社联动销售展览出版物，并向艺术机构和高校提供批发及专业供货。\n3、店员兼具选书和编辑能力，通过策展式陈列、主题橱窗和专业推荐提高转化与复购。\n4、以Newsletter、学生折扣和新品更新维护客群，经营重点是专业库存周转而非餐饮或大型活动。","cell":"O6"},"筹备启发":{"text":"1、选书：一本艺术书必须同时具备“阅读价值”和“视觉/收藏价值”\n2、做“书与书之间的关系”：策展式并置而不是图书分类 \n3、空间展陈： 墙面 = 大量专业库存 桌面 = 策展精选 橱窗 = 当下主题 杂志架 = 高频更新 局部组合 = 视觉碰撞 \n4、每一个店员都是选书/编辑专家 \n5、magazine wall","cell":"P6"}},"position":"一家以当代视觉文化为核心、强调“最新出版物 + 杂志 + 视觉灵感”的独立艺术书店。","sources":[{"title":"官网现状","url":"https://www.artwords.co.uk/"},{"title":"书店平台介绍","url":"https://bookshop.org/shop/ArtwordsBookshop"},{"title":"MACK 活动","url":"https://www.eventbrite.co.uk/e/book-launch-love-in-a-time-of-allegory-tickets-1985452192956"},{"title":"Orion Books 活动预告","url":"https://www.eventbrite.com/e/astrology-in-art-book-launch-and-talk-at-artwords-clarence-road-tickets-1998480622339"},{"title":"历史社媒报道","url":"https://londonist.com/2016/03/independent-london-bookshops-to-follow-on-instagram"}],"row":6,"summaries":{"定位客群":"生活街区中的专业书刊入口，可同时面向创意从业者与日常逛店者。","空间体验":"空间构想宜围绕可更换的主题陈列，让出版物承担视觉变化。","选品展陈":"杂志与当代视觉文化图书是核心，主题并置比单本推荐更有启发。","内容传播":"把到货、书刊内容与门店日常编辑成可读信息，选品本身就是内容来源。","活动社群":"围绕出版物发布和出版社资源展开，活动与货品主题有直接联系。","会员经营":"可研究邮件与学生读者服务，但不宜直接照搬表格中的折扣数字。","复合业态":"街区生活氛围可以形成背景，书店自身仍以专业选品为主要辨识。","商业模式":"核心参考是专业书刊供给和店员编辑能力，供货服务等记录可继续追踪。"},"topicDetails":["围绕家的尺度、家庭关系与日常物件各选一本杂志，用相同问题对比编辑角度。京东可把三本刊物并置为一个微型内容专题，呈现选书理由。","拆解一本杂志如何用镜头、文字与人物把一顿饭变成文化议题。京东可延伸至城市餐桌、器物和公共生活，以具体版面说明编辑手法。"],"concepts":[{"type":"空间构想","name":"可重组的杂志桌","desc":"采用能改变分组的陈列桌，每组刊物附一个共同问题。京东的视觉变化由出版物和主题承担，减少装饰性更新。"},{"type":"选品思路","name":"三本杂志的主题对照","desc":"围绕家、食物或城市，挑选编辑立场不同的刊物，比较选题与图像方式。适合京东做小规模而有解释力的杂志选品。"},{"type":"活动构想","name":"一起拆一本杂志","desc":"从封面、目录到一个专题，邀请编辑或读者讨论它为什么这样组织。将京东的翻刊内容延伸为可参与的阅读交流。"}]},{"id":"tpg","legacyId":"store4","name":"TPG Bookshop","country":"英国","city":"伦敦","type":"机构书店","tags":["馆店联动","专业社群"],"subtitle":"把展览议题延伸到阅读与摄影实践","cover":"img-344ef74f42b7","images":[{"image":"img-344ef74f42b7","alt":"TPG Bookshop 调研配图","caption":"TPG Bookshop · 原表配图 / 第7行","url":""},{"image":"img-f1db0c05d6e8","alt":"TPG 官网视觉截图","caption":"TPG · 官网首屏 / 2026-09-10 · 查看网站","url":"https://bookshop.thephotographersgallery.org.uk/"},{"image":"img-86e300e8b262","alt":"TPG Bookshop 账号证据 ME1788934005267.png","caption":"TPG · 画廊主账号截图（非书店账号）","url":""},{"image":"img-e2626e2b991c","alt":"TPG Bookshop 调研配图","caption":"TPG Bookshop · 原表配图 / 第7行","url":""},{"image":"img-3988b67086b3","alt":"TPG Bookshop 调研配图","caption":"TPG Bookshop · 原表配图 / 第7行","url":""},{"image":"img-1c1fe30fcd59","alt":"TPG Bookshop 账号证据 ME1788934009451.png","caption":"TPG · 画廊主账号截图（非书店账号）","url":""},{"image":"img-46679796ed04","alt":"TPG Bookshop 账号证据 ME1788934013164.png","caption":"TPG · 画廊主账号截图（非书店账号）","url":""}],"operations":{"账号矩阵":"馆方 IG @thephotographersgallery：Takeovers 等艺术内容；书店 @tpgbookshop：账号线索，缺样本；书店官网与邮件：展览／活动书目、商品；机构渠道：会员、学习、Print Sales。","内容分布":"已见 IG 样本属于馆方，以摄影师介绍、作品与致谢为重心；书店官网按展览、活动、经典摄影、zine组织。两者不能合算内容占比。 选题样本：Japanese Women Photographers 相关书目；Sayuri Ichida／Emi Anrakuji 客座作品；乌克兰和波兰当代出版。","活动节奏":"Takeovers 有跨年档案但未证固定周期；书店以展览与艺术家项目节点联动，具体签售频率待补。","渠道联动":"直接证据：Exhibition Related／Events Related 分类，以及艺术家公告说明因展览引进相关出版物。可形成展览→议题→书目与现场→继续阅读的路径。"},"visual":{"线下空间":"原表中书店是高密度专业库存与中岛展示；另两张为馆方展陈画面，不能当成书店货架风格。","官网界面":"深色页头突出画廊字标，浅色商品区域与大幅横幅相接；摄影器材也进入商业展示，兼具机构身份和零售功能。","社媒表达":"画廊主账号Takeovers以黑底介绍／致谢卡及统一标识组织嘉宾作品；书店独立社媒视觉缺样本。","整体调性":"稳定栏目外框容纳差异化摄影作品；借鉴时应保留艺术家作品的完整表达，并明确馆号与店号边界。"},"tone":"机构识别 · 摄影主体 · 栏目统一","visualBasis":"依据：人工表J／K列、既有账号截图；官网观察于2026-09-10。风格为样本归纳，非效果评价。","insight":"馆方IG以摄影师客座、作品与讨论为重点，书店官网以展览／活动相关书目和商品承接；书店独立账号缺样本，应与馆号分开。展览引进关联出版物已有直接案例。可借鉴“馆方议题—阅读导读—相关书架—活动／购书”的协作机制。","topics":["看完艺术与科技的展，再读什么？","从一张作品到一本摄影书：艺术家如何编排观看？"],"idea":"优先建立馆店共用选题会：美术馆负责作品与艺术家信息，京东书店负责入门解释、延伸阅读和有货书目。","conditions":"馆方月度议题、艺术家素材与书目审核；书店库存／预订入口、到店导视。","limits":"Takeovers 不是书店自有栏目；Print Sales 属机构；会员折扣数字待独立核验。","notes":{"定位客群":{"text":"展览内容转化型。直接位于摄影美术馆内部、Soho/Oxford Circus附近，书店选品几乎就是美术馆内容的延伸，同时卖摄影书、Zine、胶片和模拟摄影用品。 \t摄影师、摄影学生、收藏家、摄影爱好者、美术馆观众、游客\t展览客流→书店消费非常直接；同时书店自身也有目的性客户","cell":"F7"},"空间体验":{"text":"/空间假如展览功能，书店选品必须跟展览强绑定。卖\"体验周边\"——不只是书，还有跟主题相关的文创/工具。","cell":"G7"},"用户体验":{"text":"1、书店与楼上摄影展构成完整动线：看展后可继续查找画册、zine 与期刊，把观展兴趣自然转化为购买和学习。\n2、库存深，除摄影书外还提供 150 多种胶卷、相机与器材；中文访客称其为“摄影爱好者天堂”，能买到专业画册与常用胶片。\n3、店员专业，可协助寻找单本或配置整套资料库；营业通常到 18:00，建议预留充足时间，周五免票时可提高“看展＋逛店”性价比。","cell":"H7"},"选品展陈":{"text":"几乎围绕摄影建立完整体系：经典摄影集、艺术家专著、理论、zine、独立出版、签名及稀有版本。陈列兼具“专业资料库”和museum shop感，主题/摄影师分组清晰，新书与展览形成联动。","cell":"I7"},"活动社群":{"text":"与美术馆展览、讲座、开放征集、摄影节、Print Sales 联动","cell":"K7"},"会员经营":{"text":"复用摄影师画廊机构会员：会员制，展览免票、会员专属活动、书店 20% 折扣、咖啡 10%，普通用户邮件订阅","cell":"L7"},"复合业态":{"text":"无自营咖啡，有独立咖啡馆","cell":"M7"},"异业合作":{"text":"摄影艺术家签售，和摄影节、摄影机构联动；售卖胶片、相机配件；画廊展览配套画册首发；摄影主题线下导览、分享会","cell":"N7"},"商业模式":{"text":"1、收入由摄影书、展览图录、限量版画、胶片及相机配件共同构成，商品结构比单一书店更丰富。\n2、依托摄影师画廊的展览、讲座、摄影节和开放征集获取稳定客流，书店承担展览内容的延展销售。\n3、复用画廊会员体系，通过展览免票、书店折扣和会员专属活动提升消费频次与机构黏性。\n4、艺术家签售、主题导览和画册首发形成内容到交易闭环，核心壁垒是摄影专业资源和机构品牌。","cell":"O7"},"筹备启发":{"text":"1、和美术馆展览闭环联动","cell":"P7"}},"position":"以摄影为核心，把展览、艺术家、摄影书、Zine、杂志、器材、活动和收藏连接起来的专业摄影文化书店。","sources":[{"title":"书店官网","url":"https://bookshop.thephotographersgallery.org.uk/"},{"title":"Takeovers 说明及档案","url":"https://thephotographersgallery.org.uk/tpg-takeovers"},{"title":"艺术家公告","url":"https://www.paulinakorobkiewicz.com/news/2026/1/5/available-now-at-the-photographers-gallery-bookshop"},{"title":"投稿现状","url":"https://bookshop.thephotographersgallery.org.uk/pages/photobook-submission"},{"title":"机构渠道入口","url":"https://linktr.ee/thephotographersgallery"}],"row":7,"summaries":{"定位客群":"展览观众与摄影专业读者相遇，机构内容为找书提供了清晰入口。","空间体验":"空间应承接观展后的继续阅读，书目与摄影工具可围绕同一议题组织。","选品展陈":"以展览、活动和摄影领域组织书目，连接作品欣赏与摄影实践。","内容传播":"馆方讲作品，书店提供继续阅读入口；两类渠道各有内容职责。","活动社群":"展览与艺术家项目提供节点，更适合研究馆店协同，而非独立制造热点。","会员经营":"参考的是机构权益与书店阅读的关联，而非额外再建一套孤立会员。","复合业态":"书店与馆内餐饮是相邻服务，适合研究动线与主题联动。","商业模式":"出版物与摄影相关商品共同承接专业需求，资源条件来自摄影机构。"},"topicDetails":["从未来展览中的一个问题出发，组织入门、延伸、深入三层书单。京东可先积累“作品问题—解释材料—延伸阅读”的栏目模板，让书单真正承接观展体验。","对照单张作品与它在摄影书中的前后页，观察排序、留白与重复如何改变意义。京东可制作翻页讲解，帮助读者从看照片进入理解一本书。"],"concepts":[{"type":"空间构想","name":"展后继续读的停留点","desc":"在展览与书店的衔接处设置简明阅读入口，按观众刚遇到的问题呈现书目。京东可研究它与休息、翻阅动线的关系。"},{"type":"选品思路","name":"从观看到实践的摄影组","desc":"把作品集、摄影方法与相关工具分层组织，说明哪些用于理解、哪些用于实践。让京东的摄影选品超出单纯画册集合。"},{"type":"活动构想","name":"带着一张作品来读书","desc":"从一张作品的问题出发，结合艺术家背景与书页讨论观看方式。京东可将其构思为观展后的延伸阅读活动。"}]},{"id":"ica","legacyId":"store5","name":"ICA Bookshop","country":"英国","city":"伦敦","type":"机构书店","tags":["馆店联动","文化社交"],"subtitle":"从文化议题走向讨论、出版与参与","cover":"ica-current","images":[{"image":"ica-current","alt":"ICA 书店官网选书网格","caption":"ICA · 书店官网选书界面 · 本轮补充","url":"https://shop.ica.art/"},{"image":"img-61cc969d1422","alt":"ICA 官网视觉截图","caption":"ICA · 官网首屏 / 2026-09-10 · 查看网站","url":"https://shop.ica.art/"}],"operations":{"账号矩阵":"ICA 主站：展览、电影、公共项目、会员；shop.ica.art：出版物、Editions、周边；邮件提供机构触达；@icalondonbookstore 仅历史账号线索，未取得现行样本。","内容分布":"可证内容供给来自当代艺术与思想、独立出版、书展和讨论；没有IG样本，不对社媒主次分布下结论。 选题样本：GLUE 独立书展；Members’ Book Club；Ear Worms 聆听／写作聚会。","活动节奏":"GLUE 有2025与2026连续年份页面；2026年9月12—13日为预告。会员读书会周期未核；Ear Worms 双周形式仅是2022年历史案例。","渠道联动":"书展把出版物展售与谈话、zine／装订体验组合；机构会员连接读书会和商店。分析：议题发现→参与讨论／制作→出版物阅读→再次参加。"},"visual":{"线下空间":"人工表将线下概括为朴素、密集的独立出版陈列；本批没有门店图，不能据此确认具体色彩或材料。","官网界面":"浅灰底、黑色字标、小尺寸导航和规则书封网格，书名／作者／价格直接呈现；界面装饰少，视觉重心落在出版物。","社媒表达":"未提供ICA书店账号截图，不能将机构视觉或官网风格直接认定为其社媒调性。","整体调性":"已有证据支持“让出版物承担视觉”的方向；线下和社媒的整体一致性尚需补图确认。"},"tone":"出版陈列 · 克制界面 · 议题导向","visualBasis":"依据：人工表J／K列、既有账号截图；官网观察于2026-09-10。风格为样本归纳，非效果评价。","insight":"以机构的展览、电影、公共讨论为内容来源，商店连接出版物、Editions及周边，GLUE书展和会员读书会形成参与场景。独立书店社媒与固定频次待核。可借鉴议题向书单、讨论及制作体验的延伸，日常小型项目逐步积累为出版聚会。","topics":["当 AI 可以计算“牵挂”，阅读还留下些什么？","把一场讨论变成一本小刊：技术如何改变日常生活"],"idea":"从馆方艺术科技议题发散社会与日常生活问题；先做小型开放讨论，资源成熟后再做出版者聚会。","conditions":"馆方议题确认、主持与出版方；不同观点的清楚呈现；工作坊材料与组织。","limits":"账号与月度排期待补；不将机构所有项目算作书店生产。","notes":{"定位客群":{"text":"当代艺术机构型。不是商业街逻辑，而是完全嵌入 ICA 的展览、电影、表演、讨论和文化项目。选品围绕艺术、设计、写作和文化研究展开。 \t艺术家、策展人、作家、文化研究者、艺术学生、年轻文化从业者\t活动驱动明显，尤其适合展览、讲座、电影之后继续消费。","cell":"F8"},"空间体验":{"text":"/如果空间有放映/演出功能，书店必须延长营业时间跟活动结束时间对齐。\"夜间书店\"本身就是差异化标签。自有出版品牌做深度内容。","cell":"G8"},"用户体验":{"text":"1、位于 ICA 内，可把电影、展览、咖啡与逛店串联，适合作为 The Mall 行程中的文化补给和短暂停留点。\n2、当代文化、哲学、女性主义、小出版社 杂志与 出版物 并置，并非全部晦涩专业书；访客评价其“有教育功能”，适合跨领域发现。\n3、现场档案查询能力有限；若带明确检索目的，建议先在线确认库存，否则更适合开放式浏览。","cell":"H8"},"选品展陈":{"text":"艺术、批评理论、政治、哲学、设计和大量zine、小出版物。相比商业艺术书店更强调思想性。陈列朴素、密集、低商业包装感，像把独立出版档案直接搬进文化机构。","cell":"I8"},"活动社群":{"text":"与 ICA 展览、电影、talk、live programme 共享人群；书店本身承担延展销售","cell":"K8"},"会员经营":{"text":"复用ICA 当代艺术中心会员，会员书店消费折扣（展览/电影免票、书店10%、餐饮10%)、艺术家限量版优先购买","cell":"L8"},"复合业态":{"text":"无自营咖啡，有独立咖啡馆","cell":"M8"},"异业合作":{"text":"跟随 ICA 展览做配套出版物；论坛、影像放映、表演艺术联动；独立出版、激进理论主题活动","cell":"N8"},"商业模式":{"text":"1、销售图书、杂志、Zine、艺术家版画和限量艺术品，兼顾日常零售与高毛利收藏商品。\n2、复用ICA的展览、电影、论坛和现场表演客流，围绕艺术议题配置出版物并承接内容延展消费。\n3、ICA会员可享书店及餐饮折扣、限量版优先购买等权益，以机构会员体系推动转化和复购。\n4、经营优势在于策展与思想内容资源，不单靠畅销书，而是通过议题选品和艺术家合作形成差异化。","cell":"O8"},"筹备启发":{"text":"1、和美术馆的联动：不只简单根据展览选画册/周边，而是根据展览主题发散相关思想/议题\n2、艺术家为书店定制限量款出版物/周边","cell":"P8"}},"position":"以当代艺术机构的策展与思想生产为核心，将艺术、设计、写作、电影、声音、政治与社会议题转化为出版物、杂志、Zine、艺术家版画和限量艺术品的“思想型艺术书店”。","sources":[{"title":"ICA 商店","url":"https://shop.ica.art/"},{"title":"GLUE 2025","url":"https://ica.art/talks/glue-ica-bookfair-and-creative-programme"},{"title":"GLUE 2026","url":"https://www.ica.art/talks/glue-2026"},{"title":"会员页","url":"https://ica.art/become-a-member"},{"title":"2022年活动档案","url":"https://www.ica.art/talks/2022"},{"title":"历史账号线索","url":"https://indigo-pepper-mj9f.squarespace.com/all-posts/where-to-find-art-bookshops-in-london"}],"row":8,"summaries":{"定位客群":"文化项目吸引的读者是关键背景，书店嵌入展览、电影和思想讨论。","空间体验":"空间构想可关注活动后的停留与夜间阅读，让时间安排回应文化现场。","选品展陈":"以艺术、写作与文化研究组织阅读，选书侧重议题之间的联系。","内容传播":"机构项目提供内容背景，书店目录把议题延伸为可阅读的出版物。","活动社群":"讨论、聆听和独立出版等形式强调参与，适合与单向讲授型活动比较。","会员经营":"机构会员关系是重要参考，书店权益应与文化参与形成联系。","复合业态":"餐饮、放映与书店共同构成机构体验，重点在相互衔接而非简单叠加。","商业模式":"零售与艺术家版本依托策展资源，适合研究内容资源怎样形成独特供给。"},"topicDetails":["围绕“技术如何影响关心他人”选择文学、艺术与技术伦理的不同材料。京东可以用一个生活情境引出两种观点和三本书，让讨论聚焦人的经验。","以通勤、社交或推荐算法为问题，收集观点、阅读摘记与图像，整理成小刊的内容框架。京东可把一场议题讨论延伸为可继续翻阅的编辑成果。"],"concepts":[{"type":"空间构想","name":"散场后的阅读角","desc":"在放映或公共活动出口附近预留小型阅读与讨论位置，主题书目承接刚发生的话题。营业与开放方式留待整体空间安排明确。"},{"type":"选品思路","name":"一个议题的不同声音","desc":"对同一技术或社会问题选取文学、艺术与研究类材料，明确观点差异。京东可避免“只有一个答案”的主题选书。"},{"type":"活动构想","name":"关于日常技术的圆桌","desc":"从推荐算法、数字记忆等具体情境出发，让参与者先读材料再讨论。成果可整理为观点卡或小刊，而非仅留现场照片。"}]},{"id":"riba","legacyId":"store6","name":"RIBA Books","country":"英国","city":"伦敦","type":"机构书店","tags":["专业社群"],"subtitle":"用专业书目回答学习与工作问题","cover":"img-b666385b3af5","images":[{"image":"img-b666385b3af5","alt":"RIBA · 机构官网（非书店商城）","caption":"RIBA · 机构官网（非书店商城） / 2026-09-10 · 查看网站","url":"https://www.riba.org/"}],"operations":{"账号矩阵":"书店 X @RIBABooks：新品／活动线索；官网：专业书、历史博客、邮件；机构 Future Architects：学习支持、视频／播客等，属于机构资源。","内容分布":"可见历史内容以专业问题、入门书目、专家推荐与作者观点为主；当前社媒分布没有完整样本。 选题样本：President’s Picks；建筑学生入门书单；事务所工作与生活。","活动节奏":"实体店随66 Portland Place翻修关闭，线上书店继续。历史名家书单／作者文章不能当作2026固定更新栏目；邮件周期未核。","渠道联动":"当前主要研究“专业问题→文章／资源→书目→线上购买”；机构活动可异地或线上继续，历史总部到店动线须独立标注。"},"visual":{"线下空间":"人工表所述历史空间偏专业资料库，强调分类效率；实体店正在翻修，不作为当前空间视觉。","官网界面":"RIBA机构官网以红白为主，醒目的红色字标、建筑大图、粗体标题和细线建立专业层级；书店商城ribabooks.com仍受访问限制，不能直接套用机构视觉。","社媒表达":"未提供RIBA Books社媒截图；机构网站与已有栏目记录不能替代书店账号的视觉证据。","整体调性":"机构端以建筑影像和鲜明红色建立识别；书店的线上线下一致性仍需商城及账号截图核对。"},"tone":"机构红白 · 建筑大图 · 专业表达","visualBasis":"依据：人工表、机构官网与馆方书店页面，观察于2026-09-10。机构、集团与单店分别标注；风格为样本归纳。","insight":"历史博客以专业问题、专家书单、作者文章组织内容，X账号提供新品／活动线索，机构学习资源与线上书店衔接。实体店因总部翻修关闭，不能沿用当前到店联动。可借鉴“读者问题—专家解释—分级书目”，当前更新频次待核。","topics":["为什么一条书店动线，会改变你发现书的方式？","第一次读建筑：先学会看光、材料和尺度"],"idea":"将如恩空间与建筑设计书区转为公众可理解的问题；兼顾专业读者深度与普通观众入门。","conditions":"建筑／空间团队提供可公开设计依据；专家审阅；分级书目。","limits":"不承诺当前总部到店活动；行业折扣范围不扩大为全部商品。","notes":{"定位客群":{"text":"行业机构型\t依附建筑师协会总部，以专业机构聚集精准行业人群\t建筑师、事务所、建筑学生、会员、研究者","cell":"F10"},"空间体验":{"text":"/空间本身要有\"故事性\"——历史/设计/建筑细节能成为传播点。同一空间内多业态联动。","cell":"G10"},"用户体验":{"text":"截至 2026-09，66 Portland Place 因 House of Architecture 翻修仍关闭，当前无法形成线下到店体验，用户主要转至 RIBAbooks.com 购买。\n历史体验是一站式建筑专业资料库，书籍、文具、礼品、施工合同可与总部展览和咖啡空间联动，对建筑从业者的专业检索效率很高。\n回填原表时应将“暂停营业”置顶，避免把历史线下体验误当现状。","cell":"H10"},"选品展陈":{"text":"高度专业的建筑书店，覆盖建筑史、建筑设计、城市、景观、施工、法规及职业实践。陈列更接近专业资料库：主题分类明确、信息效率优先于“漂亮”。","cell":"I10"},"活动社群":{"text":"活动主要由 RIBA 体系承载：讲座、CPD、建筑游览、展览、专业课程","cell":"K10"},"会员经营":{"text":"复用RIBA 英国皇家建筑师学会会员，会员购书折扣；面向建筑行业 B 端订阅服务","cell":"L10"},"复合业态":{"text":"书店无咖啡；RIBA 大楼内有公共咖啡厅","cell":"M10"},"异业合作":{"text":"建筑论坛、建筑师讲座；建筑展览配套出版物；和建筑事务所、建筑院校合作；建筑竞赛配套书籍发售；面向建筑师、学生 B 端服务","cell":"N10"},"商业模式":{"text":"1、核心收入来自建筑专业书、设计指南、行业标准及RIBA自有出版物，专业刚需使需求相对稳定。\n2、复用英国皇家建筑师学会会员体系，通过购书折扣、行业订阅和专业内容提升会员消费。\n3、讲座、CPD课程、建筑游览和展览持续导流，书店与职业教育、行业交流形成协同。\n4、面向建筑事务所、院校和学生开展专业供货及B端服务，机构背书和垂直库存是主要壁垒。","cell":"O10"},"筹备启发":{"text":"和全国甚至国际艺术相关联盟建立深入合作，让书店成为联盟日常活动聚集地","cell":"P10"}},"position":"以建筑为核心、面向专业人士与建筑文化爱好者的“专业知识型艺术书店”。","sources":[{"title":"RIBA · 机构官网（非书店商城）","url":"https://www.riba.org/"},{"title":"官方说明","url":"https://www.riba.org/news/last-chance-to-visit-the-riba-bookshop-before-66-portland-place-temporary-closure/"},{"title":"About","url":"https://www.ribabooks.com/about-us"},{"title":"Newsletter","url":"https://www.ribabooks.com/newsletter"},{"title":"名家书单","url":"https://www.ribabooks.com/blog/month/2022-1"},{"title":"学生书单","url":"https://www.ribabooks.com/blog/month/2021-9"},{"title":"作者观点","url":"https://www.ribabooks.com/blog/month/2022-4"},{"title":"青年建筑师资源","url":"https://www.riba.org/learn/become-an-architect/apprenticeships/future-architects/"},{"title":"书店 X 账号","url":"https://x.com/ribabooks/with_replies"},{"title":"会员权益","url":"https://www.riba.org/work/member-benefits/chartered-member/"}],"row":10,"summaries":{"定位客群":"面向建筑学习与专业实践，需求由具体问题和知识阶段驱动。","空间体验":"当前更值得研究线上知识入口；历史实体空间不宜作为现行到店方案。","选品展陈":"专业书目、指南与机构出版帮助读者按问题选书，强调知识的可用性。","内容传播":"专家推荐与专业问题组织内容，传播重点是解释而非单纯展示书封。","活动社群":"机构学习资源可延伸书目阅读，需区分机构项目和书店自己举办的活动。","会员经营":"专业身份与学习服务关联紧密，启发是围绕读者成长组织权益。","复合业态":"餐饮并非核心机制，重点在专业内容和机构服务之间的协作。","商业模式":"垂直书目与专业内容构成参考价值，具体订阅与供货模式留在资料中核对。"},"topicDetails":["对比入口、转角与书架高度的不同安排，说明动线如何影响找书和偶遇。京东可制作示意图与读者路径观察，积累筹备期的空间内容。","用同一空间里的光、表面触感和身体尺度解释三个建筑概念。京东以日常观察降低专业阅读门槛，每个概念连接一本入门书。"],"concepts":[{"type":"空间构想","name":"问题式建筑导览","desc":"在建筑设计书区用光、尺度、材料等问题形成导览，配简图和入门书。帮助京东的非专业读者找到进入路径。"},{"type":"选品思路","name":"建筑阅读的三级阶梯","desc":"同一问题分别配置观察入门、案例理解和专业研究书目，标注阅读门槛。京东可服务不同基础的设计兴趣人群。"},{"type":"活动构想","name":"从一把椅子读懂尺度","desc":"借日常物件与空间细节解释建筑概念，再带入书目。适合京东构思面向公众的专业知识交流。"}]},{"id":"aa","legacyId":"store7","name":"AA Bookshop","country":"英国","city":"伦敦","type":"机构书店","tags":["专业社群"],"subtitle":"让学院研究、出版与读者持续相遇","cover":"img-7ecb6f7cedd0","images":[{"image":"img-7ecb6f7cedd0","alt":"AA Bookshop 账号证据 ME1788934020687.png","caption":"AA Bookshop · 账号截图 01","url":""},{"image":"img-9bfeb6969513","alt":"AA 官网视觉截图","caption":"AA · 官网首屏 / 2026-09-10 · 查看网站","url":"https://bookshop.aaschool.ac.uk/"},{"image":"img-a59bc3a3f72d","alt":"AA Bookshop 账号证据 ME1788934024353.png","caption":"AA Bookshop · 账号截图 02","url":""}],"operations":{"账号矩阵":"IG @aabookshop：新书与活动，主页关联 @aaschool；官网：AA出版物、活动、商品；月度邮件：新书、优惠、活动；Eventbrite：发布与谈话。","内容分布":"书封／手持书为日常重点，重复背景降低制作成本；绿色活动模板与少量空间图配合。学院出版内容提供稳定题材。 选题样本：AA Files 83；Maps Models Pictures；Book Group；建筑师专著分享。","活动节奏":"官网明确月度邮件；常规发布、谈话和Book Group有档案，具体每月次数不明。截图含8月已排项目与9—10月预告。","渠道联动":"研究／出版→书店展示→发布与读书组→月度邮件→相关书目，是由官网与学院资料归纳的运营路径。"},"visual":{"线下空间":"人工表描述现代定制书架与历史学院建筑并置，形成研究书库气质；现有账号含局部空间图，未覆盖全店。","官网界面":"白底黑字、紧凑导航及规则商品网格；服务说明和书目信息直接可见，属于清晰、实用的专业书店界面。","社媒表达":"手持书封＋白色暖气片背景重复出现；活动另用绿色信息模板，将日常图书和活动分成两种稳定视觉。","整体调性":"用低制作成本的固定形式承载专业内容：稳定的是拍摄规则与信息层级，而非复杂装饰。"},"tone":"学院书库 · 简单模板 · 内容优先","visualBasis":"依据：人工表J／K列、既有账号截图；官网观察于2026-09-10。风格为样本归纳，非效果评价。","insight":"IG以固定背景手持书和独立活动模板呈现新书、学院出版与谈话，官网承接书目／活动，月度邮件汇总新书、优惠和排期。Book Group及发布有档案但每月次数未核。可借鉴院校研究与出版资源、低成本固定拍摄和月度编辑节奏。","topics":["一本研究小刊，怎样把深圳讲清楚？","从模型到书页：建筑学生怎样呈现一个想法？"],"idea":"与深圳及港澳院校建立客座阅读合作；用固定书籍拍摄形式让专业栏目可持续。","conditions":"院校／教师合作与学生作品；固定拍摄点、主持人和月度编辑。","limits":"不把学生／校友关系等同自动开放会员权益；当月精选折扣有适用范围。","notes":{"定位客群":{"text":"专业院校型\t直接进入世界级建筑学院生态，让师生成为稳定基础客群\t建筑学生、教授、建筑师、设计师","cell":"F11"},"空间体验":{"text":"/跟高校/培训机构合作，把学员作品集结成册售卖——既是内容产出又是社区纽带。定期在书店办专业讲座/新书发布，打造\"行业人聚集地\"心智。","cell":"G11"},"用户体验":{"text":"1、书店位于 AA 建筑学院的乔治亚式建筑群内并对公众开放，校园氛围浓，适合建筑学生和从业者进行高目的性检索。\n2、专业建筑书与 AA 自出版高度集中，中文访客称其为“建筑生乐园”，公开评价也常提到店员友好、知识扎实；非建筑读者会觉得品类非常窄。\n3、书店与学校讲座、展览和高频发布会紧密联动，可现场见作者、参与讨论并购买活动生成内容，社群感强。","cell":"H11"},"选品展陈":{"text":"建筑选书更实验、更学院派：建筑理论、城市、区域研究、建筑师专著、AA出版物及少量稀有旧书。陈列简洁现代，定制书架与历史建筑形成反差；整体很像建筑学院里的研究书库。","cell":"I11"},"活动社群":{"text":"与学校 lecture、exhibition、public programme 强绑定；书店承担教学与建筑理论阅读场景","cell":"K11"},"会员经营":{"text":"复用 AA 建筑联盟学院校内会员讲座优先、图书馆权益；学生享有购书折扣；对外普通消费者无付费会员；邮件推送学生出版物","cell":"L11"},"复合业态":{"text":"书店无咖啡；AA 学院大楼公共区域有咖啡厅","cell":"M11"},"异业合作":{"text":"AA 学生实验建筑出版物发布；建筑讲座、工作坊；和全球建筑院校联动；独立建筑出版项目","cell":"N11"},"商业模式":{"text":"1、销售建筑理论、设计类图书及AA学院自有出版物，学生作品和实验出版形成独特供给。\n2、依托学院师生和全球建筑教育网络形成稳定客群，教学阅读需求支撑日常销售。\n3、书店与lecture、exhibition和public programme联动，新书发布、讲座和工作坊持续带动到店。\n4、学生折扣、图书馆权益和邮件推送促进复购，经营价值更多体现在教学支持和学院品牌传播。","cell":"O11"},"筹备启发":{"text":"和全国甚至国际艺术相关联盟建立深入合作，让书店成为联盟日常活动聚集地","cell":"P10:P11"}},"position":"以建筑为核心、连接艺术、设计、城市与理论的“学术型独立艺术书店”，同时也是 AA 学术与出版体系的线下文化接口。","sources":[{"title":"AA Bookshop 官网","url":"https://bookshop.aaschool.ac.uk/"},{"title":"活动档案","url":"https://bookshop.aaschool.ac.uk/?cat=65"},{"title":"活动组织者页","url":"https://www.eventbrite.co.uk/o/aa-bookshop-59258555403"},{"title":"2024—25年度报告，印刷页码40","url":"https://www.aaschool.ac.uk/assets/annualreview2425.pdf"},{"title":"月度邮件说明","url":"https://bookshop.aaschool.ac.uk/?page_id=1887"}],"row":11,"summaries":{"定位客群":"学院师生与建筑读者构成专业语境，研究和教学为阅读提供持续问题。","空间体验":"可探索展示研究过程的空间，让作品、草图与书目相互说明。","选品展陈":"学院出版与建筑理论形成差异，重点是研究成果如何成为阅读材料。","内容传播":"出版、讲座和研究现场互相连接，让读者看见知识产生的过程。","活动社群":"从课程与研究问题出发组织交流，比泛化的名人分享更贴近案例特点。","会员经营":"学习共同体比单纯折扣更有参考价值，校内权益需与公众服务区分。","复合业态":"校园公共服务构成背景，不应把所有配套视为书店自营业务。","商业模式":"专业零售与学院出版互相补充，关键条件是教育网络与内容供给。"},"topicDetails":["将深圳的一条街或一种生活现象拆成地图、访谈、照片与资料四类证据。京东可与城市研究者构思一组小刊，用明确问题组织地方阅读。","展示一个建筑想法在草图、模型、图表与书页中的变化。京东可用过程对照介绍研究表达，让读者理解设计如何从抽象变得可讨论。"],"concepts":[{"type":"空间构想","name":"把研究过程展示出来","desc":"以可更新展板呈现草图、模型照片与研究书目，重点解释问题和方法。京东可为院校合作预留小型研究展示界面。"},{"type":"选品思路","name":"课程问题与延伸阅读","desc":"围绕城市、材料或居住问题汇集学院出版和不同观点的书籍。京东可形成面向设计学生及公众的交叉阅读组。"},{"type":"活动构想","name":"研究者带来一个未解问题","desc":"邀请研究者携过程材料而非完成演讲，围绕一个问题一起读图和讨论。京东可积累与大湾区院校交流的活动形式。"}]},{"id":"libreria","legacyId":"store8","name":"Libreria","country":"英国","city":"伦敦","type":"独立书店","tags":["主题共创"],"subtitle":"用主题书架连接跨学科的发现","cover":"img-86c3bb51dddf","images":[{"image":"img-86c3bb51dddf","alt":"Libreria 调研配图","caption":"Libreria · 原表配图 / 第12行","url":""},{"image":"img-f544854031f2","alt":"Libreria 官网视觉截图","caption":"Libreria · 官网首屏 / 2026-09-10 · 查看网站","url":"https://libreria.io/"},{"image":"img-7acdc42f1413","alt":"Libreria 账号证据 ME1788934027757.png","caption":"Libreria · 账号截图 01","url":""},{"image":"img-521ddbff1e19","alt":"Libreria 调研配图","caption":"Libreria · 原表配图 / 第12行","url":""},{"image":"img-a80c3dd3f210","alt":"Libreria 调研配图","caption":"Libreria · 原表配图 / 第12行","url":""},{"image":"img-cff209ce101c","alt":"Libreria 账号证据 ME1788934031210.png","caption":"Libreria · 账号截图 02","url":""},{"image":"img-ae8c1e328ff8","alt":"Libreria 账号证据 ME1788934033924.png","caption":"Libreria · 账号截图 03","url":""}],"operations":{"账号矩阵":"IG @librerialondon：Staff Picks、榜单、排期；主页 Threads 入口未采样；官网／Linktree：活动、订阅、场地；Bookshop.org：书单；播客：长谈；邮件：持续触达。","内容分布":"选书推荐与月度文化排期构成可见骨架；补充夏日情境阅读、客座策展、作者现场及服务入口。 选题样本：The City／Wanderlust；Staff Picks；Summer Reading；Guest Curators。","活动节奏":"有月度榜单、月度选书订阅；活动随Cultural Programme排期。播客可见2025档案，不认定2026稳定更新。","渠道联动":"主题书架与线上书单相互对应；订阅档案可回看，活动／私人场地有入口。分析：主题发现→选书／报名→到店→订阅与再次阅读。"},"visual":{"线下空间":"原表照片中的黄色书架、镜面延伸和弯折陈列构成强识别；书脊与书封的密度形成丰富、可探索的空间感。","官网界面":"门店外观大图铺满首屏，叠加手写字标和轻量导航，先传递地点与氛围，再通向购买、订阅和活动。","社媒表达":"书堆推荐、月度榜单、拼贴式文化排期、作者现场并行；栏目形式可识别，但不追求全账号同一底色。","整体调性":"线下空间负责让人记住，线上按阅读情境和栏目重新编辑；二者共享“发现”体验。"},"tone":"黄色空间 · 情境阅读 · 编辑拼贴","visualBasis":"依据：人工表J／K列、既有账号截图；官网观察于2026-09-10。风格为样本归纳，非效果评价。","insight":"以主题策展连接实体书架、Staff Picks、月度榜单、文化排期和客座书单；官网／Linktree集中订阅、活动、场地等入口，播客提供长内容档案。月度订阅不等于发帖周期。可借鉴“一项主题—多个书区—线上书单—参与／订阅”的长期内容组织。","topics":["沿着“海”逛书店：从摄影、建筑读到深圳生活","同一个问题，穿过三个书区会得到什么答案？"],"idea":"把16书区连接成跨区主题路线，呼应“漫溯之旅”；为年轻访客、深度读者和亲子分别提供不同深度的入口。","conditions":"16书区清单、主题路线与实物库存；既有ORIGIN／CREATION／PERCEPTION叙事需项目方确认。","limits":"表格地址冲突已按官网65 Hanbury St处理；自营咖啡简餐未获证据，不采用；禁手机规则现行范围待核。","notes":{"定位客群":{"text":"创意街区型\t进入东伦敦创意人群生活/工作区，用空间与策展形成目的地\t创意工作者、媒体人、设计师、年轻知识人群","cell":"F12"},"空间体验":{"text":"/打破传统分类，用\"情绪/场景/主题\"做书架标签（如\"深夜emo\"\"搞钱指南\"\"深圳故事\"），制造偶遇感。设置一个\"数字戒断区\"（无手机无WiFi）。引入印刷/装订工坊体验。","cell":"G12"},"用户体验":{"text":"1、公开资料中的 Libreria 位于 65 Hanbury Street：约 83㎡空间以亮黄色书架、镜面延伸和弯折动线营造迷宫感，刻意让人放慢、停顿并偶遇陌生书。\n2、不按传统品类或作者，而按 The City、The Future 等主题串联跨学科书；“反算法”策展强化发现感，员工可提供深度荐书。\n3、严格禁用手机、强调安静与沉浸，对需要拍照或即时查价的人有约束；地下印刷、朗读、工作坊和发布活动把体验从买书延伸到参与。","cell":"H12"},"选品展陈":{"text":"最大特点是不按传统文学类型分类，而按“The City”“Wanderlust”等主题组合，让不同学科互相碰撞。黄色波浪书架、镜面天花和阅读角让空间本身参与选书逻辑，非常适合研究“策展式陈列”。","cell":"I12"},"活动社群":{"text":"有 Cultural Programme、订阅、私人包场、地下 risograph 印刷/工作坊","cell":"K12"},"会员经营":{"text":"月度订阅，每月惊喜书直送上门；newsletter 推送读书会、活动；无购书折扣；社群以线下读书会维系","cell":"L12"},"复合业态":{"text":"店内自营咖啡吧台，咖啡、简餐，可就座阅读","cell":"M12"},"异业合作":{"text":"作者读书会、诗歌朗读；小型文学、艺术主题沙龙；和本地创作者、独立出版社联动；店内空间可做小型活动租赁","cell":"N12"},"商业模式":{"text":"1、图书零售之外，月度惊喜书订阅提供持续性收入，并通过编辑选书强化用户期待和复购。\n2、店内咖啡和简餐延长停留时间、提高坪效，使书店同时承担阅读与社交空间功能。\n3、作者活动、读书会、诗歌朗读、Riso印刷工作坊及私人包场形成活动和场地收入。\n4、以主题策展、反算法选书和线下社群建立差异化，Newsletter负责活动触达和老客召回。","cell":"O12"},"筹备启发":{"text":"1、偶遇性策展、guest curator\n2、网络隔绝式沉浸式阅读空间","cell":"P12"}},"position":"一个以“偶遇和发现”为核心的策展型书店，用非算法式选书和迷宫般的空间，让人重新体验“逛书店”本身。","sources":[{"title":"官网65 Hanbury St","url":"https://libreria.io/newsletter/"},{"title":"官方介绍","url":"https://libreria.io/"},{"title":"书店书单入口","url":"https://uk.bookshop.org/shop/libreria"},{"title":"小说订阅档案","url":"https://uk.bookshop.org/lists/the-libreria-subscription-fiction-archive"},{"title":"播客介绍","url":"https://libreria.transistor.fm/about"},{"title":"节目档案","url":"https://libreria.transistor.fm/"},{"title":"文化节目","url":"https://libreria.io/cultural-programme/"},{"title":"Typographia 预告","url":"https://secondhome.io/event/typographia/"},{"title":"官方 Linktree","url":"https://linktr.ee/librerialondon"}],"row":12,"summaries":{"定位客群":"吸引愿意跨领域发现的读者，阅读兴趣可以先于学科分类。","空间体验":"主题书架的价值在于引导偶遇，空间构想应让分类与探索行为对应。","选品展陈":"通过主题让不同学科相遇，选择理由比新颖的标签本身更重要。","内容传播":"编辑视角把分类变成故事，内容可以解释为何这些书被放在一起。","活动社群":"读书与制作提供不同参与入口，可研究从阅读到动手的转换。","会员经营":"订阅式选书值得关注，持续关系建立在读者对编辑判断的期待上。","复合业态":"现有餐饮记录需进一步对应来源；更明确的研究线索是阅读与制作。","商业模式":"主题选书和订阅构成思路，其他收入项不宜在没有证据时推算贡献。"},"topicDetails":["以海为线索连接海岸影像、港口建筑与深圳生活记录，给出跨书区的阅读路线。京东可做可收藏的主题路线卡，把十六书区的关联讲清楚。","提出“怎样生活得更慢”等具体问题，分别从文学、设计与社会研究寻找答案。京东用不同观点的对照呈现书区之间的关系，避免把主题书单写成商品罗列。"],"concepts":[{"type":"空间构想","name":"跨书区的主题路径","desc":"用统一路线卡把海、记忆或未来等主题串过多个书区，每站说明换了什么视角。京东可让十六书区既清晰又互相连接。"},{"type":"选品思路","name":"同题异读的选书组合","desc":"给同一生活问题选择三种不同学科的回答，以差异而非相似封面组织。京东可用这种方式形成跨学科选品标准。"},{"type":"活动构想","name":"沿着一个问题逛书店","desc":"让参与者从同一问题出发选择不同书页，再分享各自路径。把京东的分类体系转化为可体验的阅读方式。"}]},{"id":"november-books","legacyId":"store9","name":"November Books","country":"英国","city":"伦敦","type":"独立书店","tags":["买手策展"],"subtitle":"将旧刊与印刷品组织成视觉档案","cover":"img-958c27f8a3e7","images":[{"image":"img-958c27f8a3e7","alt":"November Books 调研配图","caption":"November Books · 原表配图 / 第13行","url":""},{"image":"img-0ef707dd699f","alt":"November 官网视觉截图","caption":"November · 官网选品页 / 2026-09-10 · 查看网站","url":"https://november-books.com/collections/new-recommended"},{"image":"img-b7173b3984e1","alt":"November Books 账号证据 ME1788934037408.png","caption":"November Books · 账号截图 01","url":""},{"image":"img-b65b60e34dcf","alt":"November Books 调研配图","caption":"November Books · 原表配图 / 第13行","url":""},{"image":"img-999632c40c60","alt":"November Books 账号证据 ME1788934040905.png","caption":"November Books · 账号截图 02","url":""},{"image":"img-bbf196fe95ce","alt":"November Books 账号证据 ME1788934044605.png","caption":"November Books · 账号截图 03","url":""}],"operations":{"账号矩阵":"IG @novemberbooks：视觉档案与私信；官网：新到资料入口，既有研究访问受限；邮件：历史主题到货机制；预约及研究服务由街区页／卖家介绍支持。","内容分布":"书刊内页、旧杂志、时尚／音乐／亚文化及纸质零碎印刷品是样本重点；不是以日常活动海报为主。 选题样本：Street Writers；Rei Kawakubo资料；信封卡片等ephemera；旧刊视觉档案。","活动节奏":"库存与研究主题驱动，无法确认“高频”具体数量；表格小型签售／书展是待核线索，不据此设定活动周期。","渠道联动":"截图直接写预约与DM；研究／书库服务有卖家资料。分析：档案内容→提出具体需求→搜寻／预约→书目服务。"},"visual":{"线下空间":"人工表描述预约式视觉档案室；表内为商品页面配图，不是空间实拍，不能据其黑底判断店内装修。","官网界面":"本次选品页为白底、疏排字标和规则网格；书封放在统一黑底中，书名、作者与价格直接列出，突出物件和版本。","社媒表达":"深色桌面、侧放书封、内页及信封等纸品为主，年代感来自真实印刷品而非额外复古滤镜。","整体调性":"以背景的一致和资料本身的差异建立档案感，让旧刊图像和纸张成为主角。"},"tone":"暗底档案 · 旧刊质感 · 克制目录","visualBasis":"依据：人工表J／K列、既有账号截图；官网观察于2026-09-10。风格为样本归纳，非效果评价。","insight":"IG以旧刊、内页和纸质档案为主体，预约与私信承接需求，研究／书库服务延伸专业价值。历史主题邮件和当前视觉样本支持档案策展机制，固定更新及活动频次未知。可借鉴出处明确的视觉文化研究、设计师书架和专题资料服务。","topics":["为什么1997年的时尚图像还影响今天？","一张旧传单，怎样保存一座城市的文化？"],"idea":"为设计师和品牌读者构建可追溯视觉资料选题；先做内容与小型档案书架，再评估定制研究服务。","conditions":"真实旧刊、出处及年份；买手研究能力；研究委托需服务边界。","limits":"年份题目是京东策划示例，需实际书刊支撑；不能把历史邮件描述当现行周期。","notes":{"定位客群":{"text":"收藏目的地型\tCecil Court专业书街＋预约制，主动放弃普通客流\t收藏家、时尚/摄影行业、品牌","cell":"F13"},"空间体验":{"text":"/定期设置，推出\"企业/个人藏书顾问\"服务——帮公司建图书室、帮个人建书架，这是高客单价业务。设置\"稀有书预约鉴赏\"服务，制造稀缺感和尊贵感。","cell":"G13"},"用户体验":{"text":"1、目前为预约制，不是随到随逛；预约门槛带来更私密的一对一体验，但对临时游客不友好。\n2、空间更像视觉文化档案与私人收藏室，时尚、摄影、设计、电影、音乐、亚文化旧书及 ephemera 混排，淘书乐趣来自稀缺发现。\n3、接受 wants list、专题研究和整库搭建，服务更像资料顾问；库存、品相与价格通常需要邮件或现场沟通，适合需求明确的专业买家。","cell":"H13"},"选品展陈":{"text":"视觉文化中的“地下资料库”：摄影、街头文化、青年文化、时尚、音乐、亚文化、旧杂志和ephemera很多。新旧书混合并按主题策展，像设计师做moodboard的实体资料室，稀有度高于完整度。","cell":"I13"},"活动社群":{"text":"官网活动信息较弱，更像选品型线上书店；通过 Instagram 和新品上架维持关注","cell":"K13"},"会员经营":{"text":"小型独立书店，无付费会员；ins & 邮件通知新书、艺术家书到货；老客留书服务","cell":"L13"},"复合业态":{"text":"无","cell":"M13"},"异业合作":{"text":"小规模艺术家书、版画 发布；小型线下签售；和版画工作室合作；参与艺术书展；空间体量小，活动频次低","cell":"N13"},"商业模式":{"text":"1、以稀有旧书、时尚杂志、摄影书和ephemera为核心商品，依靠稀缺库存与专业判断获取较高溢价。\n2、预约制降低日常门店运营压力，并为设计师、造型师和收藏家提供更深度的一对一服务。\n3、面向品牌、艺术家和摄影师提供专题寻书、视觉研究及资料库搭建，形成高价值B端服务收入。\n4、Instagram既是线上橱窗也是视觉档案，通过高频上新、邮件通知和老客留书实现精准转化。","cell":"O13"},"筹备启发":{"text":"1、建立视觉文化档案区visual archive\n2、设计师书架designer's library：“我的设计灵感从哪里来？”\n3、1990s/2000s archive：\nTHE 90s\ni-D\nDazed\nPurple\nThe Face\nComme des Garçons\nRaf Simons\nHelmut Lang\nJapanese fashion\nClub culture\n4、自媒体选题：为什么1997年的时尚还在影响今天？\n5、为品牌/公共机构/艺术家提找视觉资源、建立视觉资料库\n6、商品体系纳入ephemera","cell":"P13"}},"position":"为艺术家、设计师、造型师和收藏家提供视觉文化灵感素材的专业猎书店","sources":[{"title":"Cecil Court 页面","url":"https://www.cecilcourt.co.uk/november-books"},{"title":"AbeBooks 卖家介绍","url":"https://www.abebooks.com/november-books-london/56055087/sf"},{"title":"Vogue，2013","url":"https://www.vogue.com/article/find-rare-fashion-books-and-mood-board-inspiration-at-londons-november-books"},{"title":"1 Granary，2015","url":"https://1granary.com/industry/reading-list-paul-lawrence-november-books/"},{"title":"AnOther，2022","url":"https://www.anothermag.com/design-living/14171/brilliant-independent-art-and-photography-bookshops-from-around-the-uk"}],"row":13,"summaries":{"定位客群":"收藏与视觉研究读者的目的性较强，适合深度找书而非广泛覆盖。","空间体验":"可研究预约翻阅与小尺度资料阅读，但具体服务形式需对应原始记录。","选品展陈":"旧刊与纸质材料被组织成视觉档案，版本、年代和语境构成阅读价值。","内容传播":"图像成为进入旧刊的入口，进一步内容应补充设计和时代背景。","活动社群":"更适合围绕稀有资料与发布节点理解，固定活动频次不是现有资料重点。","会员经营":"到货通知与老客找书关系值得研究，暂不扩写成复杂会员体系。","复合业态":"非书业态不是主要线索，资料搜集与选书服务更贴近其特点。","商业模式":"稀有库存与专业判断构成差异；顾问服务的范围和价格仍需核对。"},"topicDetails":["选取可核对的旧刊页面，分析排版、身体姿态和摄影语气，再讨论今天仍可观察到的形式。京东可把版本与年代信息放进图注，建立有依据的视觉档案栏目。","从一张传单的字体、地点、时间与活动信息进入城市文化。京东可延伸到深圳的票据、海报与出版物，形成“小纸片里的城市史”。"],"concepts":[{"type":"空间构想","name":"可坐下翻阅的档案角","desc":"小范围展示旧刊与纸质材料，配版本、年代和主题索引，兼顾保护与翻阅。京东可把视觉研究转化为有停留价值的空间。"},{"type":"选品思路","name":"旧刊与当代出版对读","desc":"围绕版式、城市或身体影像选择新旧材料，说明变化和连续性。京东用版本判断建立区别于普通新品推荐的内容深度。"},{"type":"活动构想","name":"一张纸的城市故事","desc":"邀请收藏者或研究者带传单、票据与小刊，结合可核对的时间地点讨论。为京东积累深圳地方文化的阅读素材。"}]},{"id":"good-press","legacyId":"store10","name":"Good Press","country":"英国","city":"格拉斯哥","type":"独立书店","tags":["主题共创","文化社交"],"subtitle":"让创作者与读者参与出版过程","cover":"img-613e2b5a8711","images":[{"image":"img-613e2b5a8711","alt":"Good Press 账号证据 ME1788934047967.png","caption":"Good Press · 账号截图 01","url":""},{"image":"img-3a808387945b","alt":"GoodPress 官网视觉截图","caption":"GoodPress · 官网首屏 / 2026-09-10 · 查看网站","url":"https://goodpress.co.uk/"},{"image":"img-7a312b427100","alt":"Good Press 账号证据 ME1788934051482.png","caption":"Good Press · 账号截图 02","url":""}],"operations":{"账号矩阵":"IG @good_press：出版物、投稿与活动；官网：商品、Events、制作服务、订阅；The Paper：编辑型纸刊；邮件入口提供后续联系。","内容分布":"独立出版物平铺、鲜明背景、开放投稿及社群海报为重点；制作／投稿机制扩展内容供给。 选题样本：The Paper；读书／放映；开放投稿；小刊制作与书盒。","活动节奏":"按投稿、出版与活动项目运行；月度书盒是付费订阅机制，不能与发帖或The Paper周期混用。","渠道联动":"官方机制覆盖投稿、印刷装订、展示与销售。分析：看见征集→贡献／制作→展示分发→作者与读者再次参与。"},"visual":{"线下空间":"人工表描述DIY、非标准化的小出版物陈列，与制作／印刷空间相关；无完整门店图，空间细节待补。","官网界面":"荧光黄导航配深蓝条带和厚重字标，浅色页面容纳木纹背景的书籍网格；组织说明与商品并置。","社媒表达":"荧光黄／黄绿底色反复用于书封与内页，搭配字体鲜明的海报、征集和社群声明，直接而有参与感。","整体调性":"固定鲜明底色帮助小出版物被认出，独立印刷气质又容许作者与活动保持差异。"},"tone":"荧光底色 · 独立印刷 · 社群表达","visualBasis":"依据：人工表J／K列、既有账号截图；官网观察于2026-09-10。风格为样本归纳，非效果评价。","insight":"IG展示独立出版物、开放投稿和社群活动，官网连接印刷装订、商品及订阅，The Paper形成编辑型纸刊资产。内容由创作者与制作过程持续供给，具体发布频次未核。可借鉴“征集—制作—展示—分发—再次参与”的读者共创机制。","topics":["把深圳的一天，折成一本8页小书","一本小刊从投稿到上架，要经过什么？"],"idea":"结合深圳城市生活和CREATION叙事，试行《我们的城市小刊》；亲子可用折页书入门，专业创作者可做zine。","conditions":"编辑征集、参与规则、印刷伙伴与展示位；先外部合作印制再评估设备。","limits":"所在地为格拉斯哥；表格7:3分成、稳定收入与社区共治细节不作为本稿已核事实。","notes":{"定位客群":{"text":"独立出版社区型\t靠近本地艺术生态，书店同时承担制作、发行、活动功能\t艺术家、独立出版人、艺术学生、Zine群体","cell":"F14"},"空间体验":{"text":"/设立\"本地创作者寄售区\"——深圳本地作者/设计师的自出版物可以上架，高比例分成。引入Riso/丝网印刷体验工坊。\"午间画廊\"概念——午休时段做快闪展，吸引周边上班族。","cell":"G14"},"用户体验":{"text":"1、开放投稿让不同作者和小体量 杂志 获得同等可见性，货架像持续变化的独立出版社区，发现意外作品的乐趣强。\n2、志愿者运营、非层级与反歧视原则营造友好包容氛围，体验更偏创作者交流和社群连接，而非传统销售式服务。\n3、书店与 Riso/激光印刷、装订、展览、发布、表演和读书会共址，用户可从买书延伸到制作与参与；陈列和库存更 DIY、非标准化。","cell":"H14"},"选品展陈":{"text":"核心是独立出版生态：artist books、zines、诗歌、艺术写作、批评、政治、女性主义、摄影等。陈列通常强调“小出版物的可见性”，低价zine和小册子与正式书籍并置，DIY、非机构化气质很强。","cell":"I14"},"活动社群":{"text":"活动、开放投稿、印刷服务、gallery、订阅共同运营；既是书店也是生产/发行空间","cell":"K14"},"会员经营":{"text":"无付费会员；newsletter 推送展览；社群优先开放活动名额，社区共治","cell":"L14"},"复合业态":{"text":"无","cell":"M14"},"异业合作":{"text":"游牧式展览项目，给新锐艺术家提供展出机会；开放空间给社群做免费提案，和印刷工坊合作。","cell":"N14"},"商业模式":{"text":"1、通过全球艺术家开放投稿获取丰富供给，艺术家书采用寄售分成（约7:3），降低库存采购风险。\n2、自有出版及小型发行连接创作者和读者，书店同时承担作品生产、展示、销售和传播功能。\n3、Riso印刷、激光打印、装订等制作服务形成稳定收入，也带动创作者持续使用空间。\n4、展览、发布、表演和社群提案增强活跃度；其壁垒是低成本寄售、生产设备和创作者社区的闭环。","cell":"O14"},"筹备启发":{"text":"1、店内印刷","cell":"P14"}},"position":"以独立出版为核心的艺术书店与创作者平台，通过“书店＋艺术家出版＋Riso印刷＋画廊＋活动”的完整生态，连接艺术家、独立出版者与读者。","sources":[{"title":"官网","url":"https://goodpress.co.uk/"},{"title":"Open Policy，正文更新至2026年3月","url":"https://goodpress.co.uk/pages/open-policy"},{"title":"The Paper","url":"https://goodpress.co.uk/pages/the-paper"},{"title":"Events","url":"https://goodpress.co.uk/pages/events"},{"title":"月度订阅","url":"https://goodpress.co.uk/collections/subscriptions"}],"row":14,"summaries":{"定位客群":"独立出版创作者与读者相互转换，书店同时具有社区连接的意义。","空间体验":"空间构想可把作品展示与小型制作相邻安排，让创作过程可被看见。","选品展陈":"自出版与艺术家书提供多元声音，供给关系比统一商品风格更重要。","内容传播":"通过出版与创作过程建立内容，让读者理解作品怎样被制作出来。","活动社群":"展览、发布和制作等形式强调参与，活动可以成为作品产生的一部分。","会员经营":"社区参与比会员分级更贴近案例，可研究开放提案与持续贡献机制。","复合业态":"制作服务是值得研究的延伸方向，不能只按餐饮复合来理解。","商业模式":"出版、发行与制作形成相互支持的关系，分成比例等数字保留在详情中。"},"topicDetails":["将一天的观察拆成八个画面：路线、声音、物件与一句对话。京东可以先设计折页内容模板，让城市阅读从接收信息走向个人表达。","以一本具体小刊讲清提案、编辑、制作、定价与展示的关系。京东可用流程图和创作者访谈解释独立出版，让读者理解一本小书背后的工作。"],"concepts":[{"type":"空间构想","name":"本地创作者的出版架","desc":"为深圳自出版物设置清晰的展示与作者介绍位置，配可翻阅样本。京东可先构思入选原则与主题策划，再讨论寄售机制。"},{"type":"选品思路","name":"深圳小出版发现计划","desc":"按城市观察、图像实验与个人叙事收集本地出版线索，保留作者、工艺和内容介绍。形成京东地方性选品资源。"},{"type":"活动构想","name":"把一次观察折成一本书","desc":"围绕城市声音或通勤路线，构思八页折书活动，阅读材料与创作提示共同提供入口。成果可进入主题展示与后续交流。"}]},{"id":"koenig","legacyId":"store11","name":"Koenig Books","country":"英国","city":"伦敦","type":"机构书店","tags":["馆店联动","专业社群"],"subtitle":"以出版目录积累展览与艺术家档案","cover":"img-b262d56b8bf2","images":[{"image":"img-b262d56b8bf2","alt":"Koenig · 集团官网首屏","caption":"Koenig · 集团官网首屏 · 用户补图 / 2026-09-10 · 查看网站","url":"https://www.buchhandlung-walther-koenig.de/"},{"image":"img-bbea489419cd","alt":"Koenig · 集团 Instagram（非伦敦单店账号）","caption":"Koenig · 集团 Instagram（非伦敦单店账号） · 用户补图 / 2026-09-10 · 查看网站","url":"https://www.instagram.com/buchhandlungwaltherfranzkoenig/"},{"image":"img-462e1c9c6c70","alt":"Koenig · 集团官网图书目录","caption":"Koenig · 集团官网图书目录 · 用户补图 / 2026-09-10 · 查看网站","url":"https://www.buchhandlung-walther-koenig.de/"},{"image":"img-80f2456d8470","alt":"Koenig · Serpentine 馆方书店页","caption":"Koenig · Serpentine 馆方书店页 / 2026-09-10 · 查看网站","url":"https://www.serpentinegalleries.org/visit/serpentine-shop/"},{"image":"img-e0000ae9d78e","alt":"Koenig · Whitechapel 馆方书店页","caption":"Koenig · Whitechapel 馆方书店页 / 2026-09-10 · 查看网站","url":"https://www.whitechapelgallery.org/visit-2/bookshop/"}],"operations":{"账号矩阵":"集团官网／IG @buchhandlungwaltherfranzkoenig：出版与书目；伦敦馆店／Serpentine页面：门店与馆方关联；本地独立账号、通讯和发布职责尚未厘清。","内容分布":"可证集团层面重艺术出版、目录与新书；伦敦单店社媒无样本，不推断内容占比或复制集团规模。 选题样本：展览图录；艺术家专著／特别版；可积累的出版目录。","活动节奏":"出版与展览节点驱动；没有伦敦单店的连续活动日历与发帖频次证据。","渠道联动":"集团出版体系和馆店有资料支持；分析路径：展览相关书目→图录／艺术家书→馆店／在线渠道→出版档案长期积累。"},"visual":{"线下空间":"Serpentine馆方照片呈现白色墙面、弧形顶面与连续封面展示架；Whitechapel照片中黑色中岛与浅色空间对照，书籍密集而有序。两处分店各有空间条件。","官网界面":"集团官网采用白底、灰黑导航与显著搜索栏，艺术家横幅引导到三列图书目录；书名、简介、价格及圆形购买按钮并列，右栏承接活动和出版资讯。视觉以检索与交易为骨架，由书封和专题图提供色彩。","社媒表达":"集团Instagram以书封、斜角实物摄影、内页、展陈及活动现场交替出现；黑、白及浅灰背景突出出版物，局部穿插手持书与现场文字海报。样本未呈现统一底色模板，辨识更多来自艺术出版选品与图像质感。","整体调性":"官网以目录秩序组织选购，社媒用书籍物感和艺术现场吸引阅读；伦敦馆店通过明亮空间与封面陈列呼应。可借鉴“中性信息框架＋出版物自身视觉”，不把集团账号样本等同于各分店统一规范。"},"tone":"目录秩序 · 书籍物感 · 艺术现场","visualBasis":"依据：用户补充的集团官网两屏与集团Instagram截图、伦敦馆方书店照片，2026-09-10整理。社媒判断限于可见样本，集团与单店分别标注。","insight":"集团出版目录与书目、馆方展览和本地馆店共同提供内容来源；集团账号与伦敦单店须分开，独立账号及活动频次待核。可借鉴将展览图录、艺术家书和合作出版整理成长期可检索档案，避免每次项目结束后内容散失。","topics":["展览结束以后，它留下了哪些可以继续读的书？","一本展览图录的幕后：从作品、编辑到装帧"],"idea":"为京东美术馆项目建立可检索的阅读档案，并在合作成熟后研究联合出版；使每次展览都留下可持续的书目资产。","conditions":"馆方资料、出版社联络、书目编辑；明确首版／再版／库存与项目对应。","limits":"集团、伦敦门店及合作馆分别记录；表格提及其他门店合作关系未逐项重核。","notes":{"定位客群":{"text":"美术馆共生型\t进入顶级艺术机构，把展览观众直接转化为书店客群\t艺术家、策展人、收藏家、艺术学生、国际游客","cell":"F9"},"空间体验":{"text":"/书封面朝外陈列（而非书脊），视觉冲击力翻倍，适合拍照传播。","cell":"G9"},"用户体验":{"text":"1、Serpentine South 店嵌入海德公园与美术馆，白色小空间和户外景观形成“看展—散步—逛书店”的低压力路线。\n2、国际艺术、摄影、建筑、理论书以及展览出版物、限量版、明信片较全，适合视觉型读者和游客在观展后继续发现与购买。\n3、馆店体量有限，体验更偏新书与当期艺术机构内容；想深度淘旧书或稀见版本的用户未必满足，且 Serpentine 与 Whitechapel 两店库存会有差异。","cell":"H9"},"选品展陈":{"text":"国际当代及现代艺术、摄影、建筑、批评理论是主轴，专业性强，展览相关出版物也很多。陈列偏欧洲美术馆书店：分类理性、书脊陈列与封面展示结合，整体克制，让书的图像承担主要视觉效果。","cell":"I9"},"活动社群":{"text":"更偏机构书店模式，依赖美术馆、展览、出版社资源，活动通常围绕展览图录与艺术家出版物","cell":"K9"},"会员经营":{"text":"无独立书店会员；部分门店复用画廊会员享受购书折扣；邮件通讯推送画册上新","cell":"L9"},"复合业态":{"text":"书店内部无咖啡；所在画廊场馆提供独立咖啡（场馆运营）","cell":"M9"},"异业合作":{"text":"全球美术馆画册引进；和国际画廊、双年展合作出版；画册首发、艺术家对话；艺术书展参展；B 端向美术馆、高校供货","cell":"N9"},"商业模式":{"text":"1、以艺术书零售为基础，同时覆盖出版、发行和全球美术馆门店，具备较完整的艺术出版产业链。\n2、与国际艺术家、画廊、双年展及美术馆合作出版图录和艺术家书，独家内容带来稳定销售。\n3、依托美术馆和展览场景获得自然客流，并通过艺术书展、线上渠道及多城市门店扩大销售半径。\n4、面向美术馆、高校和专业机构提供B端供货，规模化渠道与出版资源构成主要经营壁垒。","cell":"O9"},"筹备启发":{"text":"","cell":"P9"}},"position":"以艺术出版为核心、连接艺术家、美术馆与全球读者的欧洲顶级艺术书店与出版体系。","sources":[{"title":"Koenig 集团 Instagram","url":"https://www.instagram.com/buchhandlungwaltherfranzkoenig/"},{"title":"Koenig · Serpentine 馆方书店页","url":"https://www.serpentinegalleries.org/visit/serpentine-shop/"},{"title":"Koenig · Whitechapel 馆方书店页","url":"https://www.whitechapelgallery.org/visit-2/bookshop/"},{"title":"Serpentine 官方门店说明","url":"https://www.serpentinegalleries.org/visit/serpentine-shop/"},{"title":"历史账号线索","url":"https://www.londonxlondon.com/bookshops-in-london/"},{"title":"集团官网","url":"https://www.buchhandlung-walther-koenig.de/"},{"title":"Julia Stoschek Foundation 图录说明","url":"https://jsfoundation.art/artworks/good-boy/"},{"title":"集团邮件机制","url":"https://www.buchhandlung-walther-koenig.de/koenig2/index.php?content=dserklaer&mode=content"}],"row":9,"summaries":{"定位客群":"依托艺术机构触达观众与专业读者，需区分品牌网络和具体门店。","空间体验":"封面展示可作为展览延伸的界面，具体空间做法应回到对应分店。","选品展陈":"图录与艺术家出版形成长期目录，重点是档案积累而非仅追新。","内容传播":"品牌官网与社媒连接出版物和艺术语境，集团样本不等同伦敦单店表现。","活动社群":"以出版与展览节点理解更合适，活动机制依赖艺术家和机构合作。","会员经营":"权益可能来自所在机构，适合研究与馆方衔接而非独立会员规模。","复合业态":"馆内咖啡属于配套背景，书店与展览之间的关系更具有研究价值。","商业模式":"零售、出版与发行形成品牌层面的组合，单店资源不能按集团规模推定。"},"topicDetails":["围绕一场展览区分图录、艺术家书与延伸理论书，解释各自留下什么。京东可以做“展览之后”的持续阅读索引，使每次专题积累都可再次进入。","按作品选择、图片排序、文字、纸张与装帧拆解一本图录。京东用编辑视角串起艺术和设计，适合图文拆书或与出版人的问答内容。"],"concepts":[{"type":"空间构想","name":"展览出版的长期索引","desc":"为过往展览与相关出版物保留可查找索引，新展结束后仍能进入阅读。京东可用它连接阶段展示与长期知识积累。"},{"type":"选品思路","name":"图录、艺术家书与理论书","desc":"同一艺术家或展览分清不同出版物的作用，给出适合的阅读顺序。帮助京东读者理解为什么这些书值得一起看。"},{"type":"活动构想","name":"一本图录怎样被编辑","desc":"围绕选图、排序、文字与装帧讨论出版决策，邀请不同角色提供材料。适合京东将艺术与设计研究结合成活动主题。"}]}],"legacy":{"findings":{"title":"02研究结论","text":"02研究结论读完案例，再看它们共同指向什么。以下为首批12家样本的阶段判断，用于引出京东计划，不代表全部书店的普遍规律，也不代表运营效果排名。馆店联动京东可优先把美术馆议题转成阅读入口、相关书目与活动。TPG提供展览选品联动证据，ICA补充讨论和参与形式，Koenig提示出版档案的长期价值。案例依据：TPG、ICA、Koenig。适用前提：馆店有可执行的内容协作。TPG Bookshop来源网站 · 单店分析ICA Bookshop来源网站 · 单店分析Koenig Books来源网站 · 单店分析\n栏目连载固定对谈、简单拍摄和月度主题有助于持续生产。Tenderbooks的栏目结构、AA的书籍拍摄与通讯、Libreria的选书和排期可组合成京东的日常内容方法。案例依据：Tenderbooks、AA、Libreria。适用前提：编辑、买手与嘉宾资源可持续。Tenderbooks来源网站 · 单店分析AA Bookshop来源网站 · 单店分析Libreria来源网站 · 单店分析\n选书表达把为什么选这本书讲清楚，才能让读者识别书店的专业判断。IDEA、Artwords和November提示从书页、文化背景和视觉资料出发，而不只发布新品通知。案例依据：IDEA、Artwords、November。适用前提：真实书目、出处与买手研究。IDEA来源网站 · 单店分析Artwords来源网站 · 单店分析November Books来源网站 · 单店分析"},"jd":{"title":"03京东内容","text":"03京东内容“从艺术与科技出发，用一本书重新理解生活。”本阶段以这句话统一选题方向。让普通读者有入口，让专业读者看见选书依据；空间提供线索，书与人提供持续内容。项目基础（交接包口径）可发展的内容不同读者的入口首个线下自营高端艺术文化书店；美术馆艺术科技议题作品解释、延伸阅读、创作者书架；借TPG／ICA的议题组织法看展观众：一份入门导读；深度读者：书目出处与完整访谈如恩空间、“漫溯之旅”、2×4视觉动线／材料／字体背后的阅读与设计判断；借RIBA／AA的专业问题法年轻访客：一个空间细节；设计师：过程与专业书三层叙事、16书区跨区主题书单与路线；借Libreria主题策展大众：一条路线；亲子：一个观察任务；港澳读者：适配语种书目Blue Bottle＋七鲜、可调光／直播资源食物与书、现场对谈、创作过程；借Tenderbooks合作机制生活方式读者：参与场景；深度读者：核心书与嘉宾观点这些为2026-09-09交接包中的规划信息，未获得最新项目原件确认；2028年3月试营业、6月开业也是交接包计划。当前按筹备期设计栏目：先做研究、采访与样稿，实际到店活动留待空间具备条件后。合作资源出现于规划，不代表已获执行授权。"},"topics":{"title":"04内容地图","text":"04内容地图八类内容对应具体选题。选题是可发展的编辑方向，涉及书目、展览和嘉宾的内容，需要以实际资料完成选定。01选书解读用买手判断解释一本书为什么值得读，建立专业信任。内容形式内页细节、版本差异、三书并读、杂志新读。选题展开同一个“家”，三本杂志如何回答？一本摄影书，为什么用这种顺序编排？一页纸的材质，怎样改变观看？素材准备　实物书、准确版本、可展示的内页和买手推荐理由。传播承接　书页特写＋图文解释；短视频翻阅；线下书签导读。案例参照　IDEA · Artwords · November Books02展览延读把馆方讨论延伸成普通观众能继续阅读的问题。内容形式展前入门、展后书单、作品关键词、跨领域阅读。选题展开当AI可以计算“牵挂”，阅读还留下些什么？看完艺术与科技的展，可以从哪本书继续？同一件作品，艺术史与科技史会怎样解释？素材准备　已经确认的展览主题、作品信息与匹配书目。传播承接　主题图文＋延伸书单；展览书架；馆方内容链接。案例参照　TPG Bookshop · ICA Bookshop · Koenig Books03人物书架通过一个人的阅读选择理解其创作，形成连续人物内容。内容形式私人书架、创作参考、一本书对谈、嘉宾选书。选题展开设计师家里哪5本书被翻得最多？从第一张草图到最后一页，创作者读过什么？一本食谱怎样变成一本设计书？素材准备　嘉宾真实阅读经历、采访、书目与素材许可。传播承接　访谈主篇＋翻书短片＋嘉宾书架。案例参照　Tenderbooks · Claire de Rouen · Libreria04空间阅读把空间体验转成可理解、可传播的设计内容。内容形式动线观察、光与材料、字体细节、跨区路线。选题展开一条书店动线怎样改变发现书的方式？同一本画册在不同光线下有什么不同？沿着“海”穿过三个书区，会读到什么？素材准备　可公开的如恩设计资料、2×4视觉资料及16书区清单。传播承接　细节图文＋路线导读；设计师讲解；空间阅读卡。案例参照　RIBA Books · AA Bookshop · Libreria05城市观察从深圳和大湾区的生活提出问题，连接本地文化读者。内容形式建筑与城市、海岸与迁徙、街头视觉、地方出版。选题展开一张旧传单怎样保存城市记忆？从深圳海岸线出发，可以读哪些摄影与建筑作品？深圳与香港的城市小刊如何记录日常？素材准备　本地采访、准确出处、城市书目与创作者合作。传播承接　城市专题＋书单；在地对谈；小刊展示。案例参照　RIBA Books · Libreria · November Books · Good Press06生活跨界用食物、饮品、时尚等日常经验进入阅读，保证核心书不缺席。内容形式书与食物、杂志与生活、衣物与图像、主题体验。选题展开一本杂志怎样把食物拍成文化？一件衣服与一张照片，怎样讲同一个主题？和一杯咖啡一起读完一本短书，会留下什么？素材准备　核心书目；饮品与食物合作可执行条件；明确参与方式。传播承接　场景图文＋翻书内容；小型体验；主题书桌。案例参照　Tenderbooks · Claire de Rouen · Artwords07出版现场让读者看到内容怎样成为一本书，拓展专业深度。内容形式编辑幕后、装帧过程、艺术家出版、版本档案。选题展开一本展览图录，从作品到成书经历什么？一本小刊从投稿到上架要经过什么？限量、签名与再版，究竟有什么不同？素材准备　出版伙伴、过程素材、版本资料与编辑采访。传播承接　过程连载＋采访；样书展示；出版物发布。案例参照　IDEA · AA Bookshop · Good Press · Koenig Books08读者共创让读者贡献具体内容，积累能够展示和回看的阅读成果。内容形式城市小刊、折页书、读者书单、共同阅读笔记。选题展开把深圳的一天折成一本8页小书读同一本书的三个人，会标记哪三页？把一次讨论中的问题编成一本小刊素材准备　征集规则、编辑整理、作品展示与印制伙伴。传播承接　征集图文＋作品展示＋制作记录；线下工作坊。案例参照　ICA Bookshop · Good Press"},"framework":{"title":"05运营框架","text":"05运营框架围绕一个读者问题组织内容。先决定讲什么，再确定栏目形式，最后匹配传播载体。01主题来源馆方议题、买手选书、创作者、空间设计与城市生活。02内容组织以选书解读、展览延读和人物书架为基础，关联其他内容类型。03选题展开每篇回答一个具体问题，给出书目、作品或真实人物依据。04传播承接图文用于发现和收藏，视频呈现人物与过程，长文积累档案，现场连接书架与体验。主题示例以“图像怎样改变城市记忆”为例，同一主题可以连接多个栏目，每篇承担不同的阅读任务。内容类型对应选题读者获得选书解读一本摄影书怎样重新编排一座城市？理解书籍叙事与选书理由人物书架摄影师拍深圳之前，会翻哪些书？进入创作者的阅读与观察方式城市观察一张旧传单保存了怎样的街区生活？了解具体地点与文化背景读者共创用8页小书记录你熟悉的一段路形成可展示、可交流的读者作品渠道放在内容之后确定：优先沿用能承载该形式的既有账号；馆方提供作品和议题信息，书店补充阅读解释与书目。"}},"images":{"img-133735e19a0c":"./img-133735e19a0c.webp","img-87504f8cecc8":"./img-87504f8cecc8.webp","img-b61f43814298":"./img-b61f43814298.webp","img-09327b575985":"./img-09327b575985.webp","img-55965df0c5f2":"./img-55965df0c5f2.webp","img-84808977a16d":"./img-84808977a16d.webp","img-02290904eab1":"./img-02290904eab1.webp","img-9cfbce62771c":"./img-9cfbce62771c.webp","img-efa488e12edb":"./img-efa488e12edb.webp","img-091c1faa0713":"./img-091c1faa0713.webp","img-958c27f8a3e7":"./img-958c27f8a3e7.webp","img-0ef707dd699f":"./img-0ef707dd699f.webp","img-b7173b3984e1":"./img-b7173b3984e1.webp","img-b65b60e34dcf":"./img-b65b60e34dcf.webp","img-999632c40c60":"./img-999632c40c60.webp","img-bbf196fe95ce":"./img-bbf196fe95ce.webp","img-e8b60ff26c71":"./img-e8b60ff26c71.webp","img-a6efaccca8bc":"./img-a6efaccca8bc.webp","img-75f24f1bb016":"./img-75f24f1bb016.webp","img-dc7c681b2ca4":"./img-dc7c681b2ca4.webp","img-5206c117e1ba":"./img-5206c117e1ba.webp","img-96c7f159dc2e":"./img-96c7f159dc2e.webp","img-1b7d16b50faa":"./img-1b7d16b50faa.webp","img-344ef74f42b7":"./img-344ef74f42b7.webp","img-f1db0c05d6e8":"./img-f1db0c05d6e8.webp","img-86e300e8b262":"./img-86e300e8b262.webp","img-e2626e2b991c":"./img-e2626e2b991c.webp","img-3988b67086b3":"./img-3988b67086b3.webp","im
